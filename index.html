{id:"giadv",cat:"gia",tier:2,
 title:"Niêm yết và kê khai giá dịch vụ khám chữa bệnh",
 code:"Điều 110 Luật KCB 15/2023/QH15 · Luật Giá 16/2023/QH15 · Nghị định 85/2024/NĐ-CP", eff:"Luật Giá hiệu lực 01/7/2024 · Nghị định 85/2024 hiệu lực 10/7/2024",
 essence:"Bệnh viện tư nhân được tự quyết định giá dịch vụ, nhưng đổi lại phải kê khai giá và niêm yết công khai. Đây là nhóm nghĩa vụ bị bỏ quên nhiều nhất vì nó không thuộc ngành y mà thuộc quản lý giá, do đoàn kiểm tra khác đi kiểm tra.",
 duties:["Niêm yết công khai giá dịch vụ tại nơi khách hàng dễ thấy và trên website, đúng mức giá thực tế đang thu.",
   "Thực hiện kê khai giá dịch vụ khám bệnh chữa bệnh theo quy định, không chỉ niêm yết là xong.",
   "Bảo đảm giá thu thực tế khớp với giá niêm yết. Chênh lệch giữa bảng giá treo tường, bảng giá trên website và số tiền thực thu là lỗi rất dễ bị phát hiện qua phản ánh của khách hàng.",
   "Rà soát các gói dịch vụ và chương trình khuyến mại xem giá sau khuyến mại có được niêm yết rõ ràng không."],
 risks:["Không niêm yết giá hoặc niêm yết không đúng bị xử phạt theo Nghị định 87/2024/NĐ-CP về xử phạt trong lĩnh vực giá.",
   "Thu cao hơn giá niêm yết là loại khiếu nại khách hàng hay gửi nhất và cũng dễ chứng minh nhất, vì bằng chứng nằm ở hóa đơn."],
 notes:"Đã kiểm chứng ngày 09/09/2026: ba nghị định hướng dẫn Luật Giá gồm 78/2024, 85/2024 và 87/2024 được Nghị quyết 31/NQ-CP ngày 03/3/2026 xác nhận tiếp tục có hiệu lực từ 01/01/2026 cho đến khi có văn bản thay thế. Thông tư 21/2024/TT-BYT về phương pháp định giá dịch vụ khám chữa bệnh còn hiệu lực nhưng phạm vi áp dụng với cơ sở tư nhân cần đọc Điều 1 bản gốc để xác định.",
 src:{label:"Nghị định 85/2024/NĐ-CP trên Cổng văn bản Chính phủ",url:"https://vanban.chinhphu.vn/?pageid=27160&docid=210648"},
 q:"niêm yết kê khai giá dịch vụ khám bệnh chữa bệnh cơ sở tư nhân Luật Giá 2023"},

{id:"hoadon",cat:"gia",tier:2,flag:"new",
 title:"Hóa đơn điện tử — nền pháp lý vừa đổi",
 code:"254/2026/NĐ-CP", eff:"Ban hành 30/6/2026 · hiệu lực 01/7/2026 · thay thế Nghị định 123/2020 và 70/2025",
 essence:"Từ ngày 01/7/2026, toàn bộ khung pháp lý về hóa đơn điện tử chuyển sang nghị định mới, căn cứ Luật Quản lý thuế 108/2025/QH15. Mọi quy trình nội bộ và phần mềm còn dẫn Nghị định 123/2020 đều đã sai căn cứ.",
 duties:["Xác nhận phần mềm hóa đơn của bệnh viện và đơn vị cung cấp dịch vụ hóa đơn điện tử đã cập nhật theo nghị định mới chưa.",
   "Rà lại quy trình xuất hóa đơn cho dịch vụ khám chữa bệnh và cho bán mỹ phẩm, thực phẩm chức năng nếu có, vì đây là hai luồng doanh thu khác nhau.",
   "Cập nhật mọi tài liệu nội bộ còn viện dẫn Nghị định 123/2020/NĐ-CP hoặc Nghị định 70/2025/NĐ-CP.",
   "Đối chiếu với nghĩa vụ niêm yết giá: hóa đơn phải khớp giá niêm yết, đây là cặp bằng chứng đi liền nhau khi bị kiểm tra."],
 risks:["Vi phạm về hóa đơn thuộc thẩm quyền xử lý của cơ quan thuế, độc lập hoàn toàn với thanh tra y tế, nên không nằm trong tầm quan sát quen thuộc của bộ phận chuyên môn.",
   "Không xuất hóa đơn cho dịch vụ đã thu tiền là rủi ro kép: vừa vi phạm thuế vừa mất bằng chứng bảo vệ khi khách hàng khiếu nại về giá."],
 notes:"Đã kiểm chứng ngày 09/09/2026. Chưa xác định được nghị định có quy định riêng nào dành cho dịch vụ y tế hay không; nguyên tắc chung là dịch vụ khám chữa bệnh xuất hóa đơn điện tử như mọi dịch vụ khác. Phần này nên để kế toán trưởng đối chiếu bản gốc.",
 src:{label:"Nghị định 254/2026/NĐ-CP",url:"https://thuvienphapluat.vn/van-ban/Thue-Phi-Le-Phi/Nghi-dinh-254-2026-ND-CP-huong-dan-Luat-Quan-ly-thue-hoa-don-dien-tu-chung-tu-dien-tu-713085.aspx"},
 q:"Nghị định 254/2026/NĐ-CP hóa đơn điện tử thay thế Nghị định 123/2020"}
];

const ACTIONS = [
{id:"a1",cat:"pccc",freq:"Mỗi tháng",title:"Tự kiểm tra phòng cháy chữa cháy và lập biên bản",
 why:"Nghị định 105/2025 buộc mọi cơ sở tự kiểm tra mỗi tháng một lần. Đoàn kiểm tra hỏi biên bản này đầu tiên vì nó thuần túy là giấy tờ — không có là lỗi ngay, không cãi được.",
 steps:["Chọn một ngày cố định trong tháng, ví dụ ngày 25, và giao cho một người duy nhất chịu trách nhiệm. Đừng chia cho nhiều người.",
  "In sẵn mẫu biên bản gồm các mục: bình chữa cháy còn hạn và đủ áp, lối thoát nạn không bị chặn, đèn báo thoát hiểm sáng, hệ thống báo cháy hoạt động, tủ điện gọn gàng, kho hóa chất và cồn đúng nơi quy định.",
  "Đi một vòng toàn bộ tòa nhà theo đúng thứ tự trong mẫu, chụp ảnh những chỗ chưa đạt.",
  "Ghi rõ tồn tại và thời hạn khắc phục, ai chịu trách nhiệm khắc phục.",
  "Ký tên người kiểm tra và người đứng đầu cơ sở, đóng dấu, lưu vào một cặp hồ sơ riêng theo năm.",
  "Tháng sau kiểm tra lại xem tồn tại tháng trước đã khắc phục chưa, ghi vào biên bản mới."],
 who:"Trưởng phòng hành chính hoặc người phụ trách cơ sở vật chất, giám đốc điều hành ký duyệt."},

{id:"a2",cat:"qc",freq:"Mỗi quý",title:"Rà soát toàn bộ nội dung quảng cáo đang chạy",
 why:"Nghị định 342/2025 hiệu lực 15/02/2026 buộc mỗi mẩu quảng cáo dịch vụ khám chữa bệnh phải có đủ khối thông tin bắt buộc. Đây là việc rẻ nhất và chặn được nhiều rủi ro nhất.",
 steps:["Liệt kê ra giấy mọi nơi bệnh viện đang xuất hiện: website, Facebook, TikTok, Instagram, YouTube, Zalo OA, biển hiệu ngoài trời, tờ rơi, banner trong sảnh, bài PR trên báo.",
  "Với từng nơi, kiểm tra có đủ bốn thông tin bắt buộc chưa: tên và địa chỉ cơ sở, số giấy phép hoạt động, thời gian hoạt động, và phạm vi hoạt động chuyên môn đã được phê duyệt.",
  "Soát từ ngữ cấm: cam kết, đảm bảo, một trăm phần trăm, không đau, không biến chứng, tốt nhất, số một. Xóa hết.",
  "Soát ảnh trước và sau: mỗi ảnh phải có văn bản đồng ý của khách còn hiệu lực. Không có giấy thì gỡ ảnh xuống ngay, đừng chờ.",
  "Soát dịch vụ đang quảng cáo có nằm trong phạm vi chuyên môn được duyệt không. Quảng cáo dịch vụ ngoài phạm vi là tự khai làm sai.",
  "Ban hành quy trình: từ nay mọi bài đăng phải qua một người duyệt theo đúng checklist này trước khi lên."],

{id:"a3",cat:"dl",freq:"Mỗi quý",title:"Kiểm soát ảnh khách hàng và hồ sơ dữ liệu cá nhân",
 why:"Luật Bảo vệ dữ liệu cá nhân hiệu lực 01/01/2026 phạt tới 3 tỷ đồng với tổ chức. Bệnh viện thẩm mỹ nắm dữ liệu sức khỏe cộng ảnh cơ thể khách hàng — loại dữ liệu nhạy cảm nhất.",
 steps:["Dựng một mẫu văn bản đồng ý riêng cho hình ảnh, tách khỏi giấy cam kết phẫu thuật. Ghi rõ dùng ở đâu, trong bao lâu, và cách khách rút lại sự đồng ý.",
  "Rà toàn bộ ảnh đang dùng công khai, đối chiếu với danh sách khách đã ký. Ảnh nào không tìm được giấy thì gỡ.",
  "Liệt kê mọi nơi đang lưu dữ liệu khách: phần mềm quản lý bệnh viện, file Excel, Google Drive, Zalo của nhân viên tư vấn, điện thoại cá nhân của bác sĩ.",
  "Cấm lưu ảnh và hồ sơ khách trên thiết bị cá nhân. Đây là lỗ rò lớn nhất và không tốn tiền để bịt.",
  "Chỉ định một người phụ trách bảo vệ dữ liệu cá nhân bằng quyết định bằng văn bản, theo yêu cầu của luật.",
  "Kiểm tra phần mềm và dịch vụ lưu trữ đang dùng có đặt máy chủ ở nước ngoài không. Nếu có, đó là chuyển dữ liệu xuyên biên giới và cần làm đúng thủ tục.",
  "Lập hồ sơ đánh giá tác động xử lý dữ liệu cá nhân theo Nghị định 356/2025 và lưu lại."],
 who:"Giám đốc điều hành chủ trì, phối hợp phòng công nghệ thông tin và marketing."},

{id:"a4",cat:"kcb",freq:"Mỗi quý",title:"Đối chiếu dịch vụ đang bán với phạm vi chuyên môn được duyệt",
 why:"Làm kỹ thuật ngoài phạm vi được phê duyệt là gốc rễ của phần lớn vụ đình chỉ bệnh viện thẩm mỹ, và là tình tiết định tội khi có tai biến.",
 steps:["In bảng giá dịch vụ hiện tại và bản phạm vi hoạt động chuyên môn đã được Sở Y tế phê duyệt, đặt cạnh nhau.",
  "Kẻ ba cột: tên dịch vụ đang bán, tên kỹ thuật tương ứng theo danh mục của Bộ Y tế, có trong phạm vi được duyệt hay chưa.",
  "Đánh dấu đỏ mọi dòng chưa có trong phạm vi được duyệt.",
  "Với dòng đỏ, chọn một trong hai: dừng bán ngay, hoặc làm thủ tục bổ sung phạm vi rồi mới bán tiếp. Không có lựa chọn thứ ba.",
  "Đi kiểm tra thực tế các phòng, đặc biệt khu chăm sóc da và spa, xem có ai đang làm tiêm hoặc chiếu tia ngoài khu vực được phép không.",
  "Lưu bảng đối chiếu có chữ ký để chứng minh bệnh viện có kiểm soát chủ động."],
 who:"Người chịu trách nhiệm chuyên môn kỹ thuật lập, giám đốc điều hành duyệt."},

{id:"a5",cat:"kcb",freq:"Mỗi quý",title:"Theo dõi hạn giấy phép hành nghề của toàn bộ người hành nghề",
 why:"Giấy phép hành nghề có thời hạn 5 năm. Một bác sĩ hết hạn mà vẫn đứng bàn mổ khiến cả cơ sở chịu trách nhiệm, không chỉ cá nhân đó.",
 steps:["Lập một bảng duy nhất: họ tên, chức danh, số giấy phép hành nghề, phạm vi hành nghề, ngày cấp, ngày hết hạn.",
  "Tô màu theo mốc: đỏ nếu còn dưới 3 tháng, vàng nếu còn dưới 6 tháng, xanh nếu còn trên 6 tháng.",
  "Đặt nhắc trên lịch trước ngày hết hạn 6 tháng, vì thủ tục gia hạn cần thời gian và cần chứng minh cập nhật kiến thức y khoa liên tục.",
  "Kiểm tra phạm vi hành nghề ghi trên giấy của từng người có khớp với việc họ đang làm thực tế không.",
  "Với bác sĩ làm việc kiêm nhiệm nhiều nơi, xác nhận họ đã đăng ký hành nghề tại bệnh viện đúng quy định.",
  "Cập nhật bảng ngay mỗi khi có người vào hoặc ra."],
 who:"Phòng nhân sự lập và cập nhật, giám đốc điều hành xem hằng quý."},

{id:"a6",cat:"tb",freq:"Khi nhận máy mới",title:"Thẩm định pháp lý thiết bị trước khi đưa vào sử dụng",
 why:"Thiết bị không có số lưu hành nằm trong nhóm bị phạt cao nhất, tới 300 triệu với tổ chức. Máy thường do nhà cung cấp mang tới nên bệnh viện hay bỏ qua khâu kiểm tra giấy tờ.",
 steps:["Ra quy định nội bộ: không máy nào được cắm điện phục vụ khách trước khi hồ sơ pháp lý được duyệt. Kể cả máy mượn dùng thử.",
  "Yêu cầu nhà cung cấp nộp: số lưu hành hoặc số đăng ký của thiết bị, giấy tờ nhập khẩu, chứng nhận chất lượng, hướng dẫn sử dụng tiếng Việt, hợp đồng bảo hành và bảo trì.",
  "Đối chiếu tên và chủng loại máy thực tế với tên trên giấy tờ. Sai một chữ cũng là vấn đề.",
  "Ghi máy vào sổ theo dõi thiết bị: ngày đưa vào sử dụng, người phụ trách, lịch bảo trì và hiệu chuẩn.",
  "Đào tạo người vận hành và lưu hồ sơ đào tạo.",
  "Rà lại toàn bộ máy đang có ít nhất một lần mỗi năm bằng chính checklist này."],
 who:"Phòng vật tư thiết bị chuẩn bị hồ sơ, giám đốc điều hành ký duyệt cho phép sử dụng."},

{id:"a14",cat:"antt",freq:"Ngay lập tức",title:"Kiểm tra giấy phép còn thiếu và giấy sắp hết hạn",
 why:"Bệnh viện thẩm mỹ phải có Giấy chứng nhận đủ điều kiện về an ninh trật tự do công an cấp, độc lập với giấy phép hoạt động của Sở Y tế. Nghị định 58/2026 hiệu lực 15/3/2026 vừa mở rộng phạm vi ngành nghề này nên cơ sở dựa vào tư vấn cũ hoàn toàn có thể đang thiếu giấy mà không biết.",
 steps:["Lập một bảng duy nhất liệt kê mọi giấy phép bệnh viện đang có: giấy phép hoạt động khám chữa bệnh, giấy chứng nhận đủ điều kiện an ninh trật tự, giấy phép môi trường, giấy chứng nhận thẩm duyệt và nghiệm thu phòng cháy, hợp đồng bảo hiểm trách nhiệm nghề nghiệp, giấy phép hành nghề của từng người.",
  "Với mỗi dòng ghi rõ: số giấy, cơ quan cấp, ngày cấp, ngày hết hạn, người đang giữ bản gốc.",
  "Đánh dấu đỏ những dòng KHÔNG CÓ giấy. Riêng giấy chứng nhận an ninh trật tự, nếu chưa từng nghe tới thì gần như chắc chắn là chưa có.",
  "Đối chiếu danh sách dịch vụ đang bán với định nghĩa mới tại Nghị định 58/2026: dịch vụ dùng thuốc, chất hoặc thiết bị can thiệp vào cơ thể để thay đổi màu da, hình dạng cơ thể, khắc phục khiếm khuyết, và cả xăm phun thêu đều thuộc phạm vi.",
  "Với dòng thiếu, liên hệ công an quản lý địa bàn để hỏi thủ tục và hồ sơ. Đừng chờ tới đợt kiểm tra mới biết.",
  "Đặt nhắc lịch trước ngày hết hạn 6 tháng cho từng giấy, giao cho một người duy nhất theo dõi."],
 who:"Giám đốc điều hành trực tiếp làm bảng này, phòng hành chính hỗ trợ thu thập bản sao."},

{id:"a15",cat:"kcb",freq:"Ngay lập tức",title:"Kiểm tra tình trạng bệnh án điện tử",
 why:"Thông tư 13/2025/TT-BYT buộc cơ sở dạng bệnh viện triển khai hồ sơ bệnh án điện tử chậm nhất 30/9/2025. Mốc đã qua gần một năm, và bằng chứng tuân thủ hay không nằm sẵn trong hệ thống dữ liệu nên không thể giải thích khác.",
 steps:["Hỏi thẳng bộ phận công nghệ thông tin: bệnh viện đã triển khai hồ sơ bệnh án điện tử theo Thông tư 13/2025 chưa, có văn bản nào ghi nhận việc triển khai không.",
  "Mở phần mềm kiểm tra hồ sơ bệnh án có đủ thông tin theo Chương X Thông tư 32/2023/TT-BYT không.",
  "Kiểm tra hạ tầng: máy chủ, giải pháp lưu trữ và đặc biệt là lưu trữ dự phòng. Không có dự phòng thì chưa đạt yêu cầu.",
  "Thử nghiệm phục hồi và truy xuất một hồ sơ cũ để chắc chắn dữ liệu lấy ra được khi bị thanh tra hoặc trưng cầu giám định.",
  "Nếu chưa triển khai, lập ngay kế hoạch có mốc thời gian và người chịu trách nhiệm, lưu lại làm bằng chứng cơ sở đang chủ động khắc phục.",
  "Đối chiếu bệnh án giấy và bệnh án điện tử của cùng một ca xem có khớp nhau không."],
 who:"Phòng công nghệ thông tin báo cáo, giám đốc điều hành và người chịu trách nhiệm chuyên môn cùng duyệt."},

{id:"a16",cat:"gia",freq:"Mỗi quý",title:"Đối chiếu giá niêm yết, giá thực thu và hóa đơn",
 why:"Bệnh viện tư được tự quyết định giá nhưng phải niêm yết và kê khai. Ba con số phải khớp nhau: giá treo tường, giá trên website và số tiền ghi trên hóa đơn. Lệch nhau là loại vi phạm khách hàng tự phát hiện và tự gửi đơn.",
 steps:["In bảng giá đang niêm yết tại quầy và chụp bảng giá đang hiển thị trên website, đặt cạnh nhau.",
  "Lấy ngẫu nhiên mười hóa đơn của tháng gần nhất, đối chiếu số tiền với giá niêm yết tương ứng.",
  "Rà các gói dịch vụ và chương trình khuyến mại: giá sau khuyến mại có được niêm yết rõ ràng không, hay chỉ nói miệng khi tư vấn.",
  "Kiểm tra phần mềm hóa đơn đã cập nhật theo Nghị định 254/2026 chưa, vì nền pháp lý về hóa đơn điện tử đã đổi từ 01/7/2026.",
  "Xác nhận bệnh viện đã thực hiện kê khai giá theo quy định, không chỉ dừng ở niêm yết.",
  "Ghi lại kết quả đối chiếu có chữ ký, lưu cùng hồ sơ tuân thủ."],
 who:"Kế toán trưởng thực hiện, giám đốc điều hành duyệt kết quả."},

{id:"a12",cat:"duoc",freq:"Mỗi tháng",title:"Kiểm kê thuốc kiểm soát đặc biệt và đối chiếu sổ sách",
 why:"Thuốc gây nghiện và hướng thần là nhóm duy nhất mà chênh lệch sổ sách dẫn thẳng tới trách nhiệm hình sự, không dừng ở phạt hành chính. Thông tư 18/2026/TT-BYT vừa siết thêm và bổ sung Etomidate vào danh mục hướng thần từ 01/6/2026.",
 steps:["Lập danh sách thuốc kiểm soát đặc biệt bệnh viện đang có, đối chiếu với danh mục tại Thông tư 18/2026/TT-BYT. Chú ý các thuốc dùng khởi mê và an thần vì danh mục vừa được bổ sung.",
  "Kiểm đếm thực tế từng ống, từng vỉ trong tủ có khóa, so với số liệu trên sổ theo dõi xuất nhập tồn.",
  "Mọi chênh lệch phải truy nguyên ngay trong ngày và ghi rõ nguyên nhân, không để sang tháng sau.",
  "Kiểm tra người được giao phụ trách đã có quyết định bằng văn bản chưa, và người đó có bàn giao đúng quy trình khi nghỉ phép không.",
  "Kiểm tra vỏ ống thuốc đã dùng có được giữ lại theo quy định nội bộ không, đây là bằng chứng đối chiếu quan trọng khi có sự cố.",
  "Ký xác nhận biên bản kiểm kê, lưu cùng một cặp hồ sơ theo năm."],
 who:"Người phụ trách dược thực hiện, người chịu trách nhiệm chuyên môn kỹ thuật và giám đốc điều hành cùng ký xác nhận."},

{id:"a13",cat:"duoc",freq:"Ngay lập tức",title:"Kiểm tra đơn thuốc điện tử và nguồn gốc thuốc",
 why:"Lộ trình bắt buộc đơn thuốc điện tử theo Thông tư 26/2025/TT-BYT đã qua từ 01/10/2025 với bệnh viện. Nếu chưa làm thì cơ sở đang ở trạng thái vi phạm, và bằng chứng nằm sẵn trong dữ liệu hệ thống nên không thể giải thích khác.",
 steps:["Mở phần mềm bệnh viện, kiểm tra đơn thuốc có được tạo và lưu dưới dạng điện tử đúng quy định không, có liên thông dữ liệu không.",
  "Lấy ngẫu nhiên mười đơn thuốc gần nhất, kiểm tra đủ thông tin bắt buộc: định danh người bệnh, tên thuốc, hàm lượng, số lượng, liều dùng, cách dùng, thời gian dùng.",
  "Đối chiếu người ký đơn với danh sách người hành nghề đủ điều kiện kê đơn. Loại ngay trường hợp điều dưỡng hoặc nhân viên tư vấn ký thay bác sĩ.",
  "Lấy ngẫu nhiên năm loại thuốc tiêm đang dùng, truy ngược hóa đơn và chứng từ nhập để chứng minh nguồn gốc từng lô.",
  "Với botulinum toxin và chất làm đầy, kiểm tra giấy đăng ký lưu hành tại Việt Nam còn hiệu lực không. Đây là nhóm hay bị nhập không chính ngạch nhất.",
  "Ra quy định nội bộ cấm tuyệt đối việc đưa thuốc xách tay hoặc thuốc do người giới thiệu sản phẩm để lại vào sử dụng cho khách hàng."],
 who:"Phòng dược và phòng công nghệ thông tin phối hợp rà soát, giám đốc điều hành duyệt kết quả."},

{id:"a7",cat:"mt",freq:"Mỗi năm",title:"Báo cáo môi trường và quản lý chất thải y tế",
 why:"Bệnh viện phải có giấy phép môi trường và báo cáo hằng năm. Để lẫn chất thải lây nhiễm vào rác sinh hoạt là lỗi bị bắt nhiều nhất tại cơ sở y tế.",
 steps:["Kiểm tra giấy phép môi trường còn hiệu lực đến ngày nào, đặt nhắc gia hạn trước 6 tháng.",
  "Thu thập đủ chứng từ chuyển giao chất thải nguy hại của cả năm, mỗi lần thu gom phải có chữ ký đơn vị thu gom.",
  "Đối chiếu khối lượng chất thải thực tế phát sinh với con số đã khai trong hồ sơ môi trường. Bệnh viện thẩm mỹ thường phát sinh nhiều hơn khai báo.",
  "Tập hợp kết quả quan trắc nước thải theo tần suất ghi trong giấy phép.",
  "Lập báo cáo quản lý chất thải y tế theo mẫu Phụ lục 07 của Thông tư 20/2021/TT-BYT.",
  "Tổ chức tập huấn phân loại chất thải cho toàn bộ điều dưỡng và hộ lý, lưu danh sách ký tên."],
 who:"Cán bộ phụ trách kiểm soát nhiễm khuẩn hoặc môi trường y tế, giám đốc điều hành ký báo cáo."},

{id:"a8",cat:"ld",freq:"Mỗi năm",title:"Khám sức khỏe định kỳ và huấn luyện an toàn lao động",
 why:"Nhân viên y tế thuộc nhóm có yếu tố nguy hiểm nghề nghiệp. Đây là nhóm lỗi nằm hoàn toàn ở giấy tờ nên rất dễ bị bắt và cũng rất dễ khắc phục.",
 steps:["Lập danh sách người lao động theo nhóm yếu tố nguy hiểm: tiếp xúc máu và dịch, hóa chất, tia laser, bức xạ.",
  "Ký hợp đồng với cơ sở y tế đủ điều kiện để khám sức khỏe định kỳ và khám phát hiện bệnh nghề nghiệp.",
  "Tổ chức huấn luyện an toàn vệ sinh lao động theo đúng nhóm đối tượng, lưu danh sách và chứng nhận.",
  "Thực hiện quan trắc môi trường lao động định kỳ và lưu kết quả.",
  "Ban hành quy trình xử lý phơi nhiễm nghề nghiệp, dán tại các phòng thủ thuật, có sẵn thuốc và vật tư xử lý ban đầu.",
  "Lưu tất cả hồ sơ trên trong một cặp duy nhất để xuất trình khi thanh tra."],
 who:"Phòng nhân sự phối hợp phòng kiểm soát nhiễm khuẩn."},

{id:"a9",cat:"kcb",freq:"Mỗi năm",title:"Tự đánh giá chất lượng bệnh viện",
 why:"Thông tư 35/2024/TT-BYT đặt sàn chất lượng phải duy trì liên tục. Không có hồ sơ tự đánh giá là điểm trừ đầu tiên trong mọi đợt kiểm tra.",
 steps:["Tải bộ tiêu chuẩn chất lượng cơ bản hiện hành từ cổng Bộ Y tế và xác nhận đúng phiên bản mới nhất.",
  "Phân công từng nhóm tiêu chí cho từng khoa phòng tự chấm, có bằng chứng kèm theo.",
  "Họp hội đồng chất lượng để thống nhất điểm và xác định các tiêu chí chưa đạt.",

function isSpecificOfficialSource(u){
  try{
    const p = new URL(u);
    if(p.protocol!=="https:") return false;
    const h=p.hostname.toLowerCase();
    if(!OFFICIAL_HOSTS.some(x=>h===x||h.endsWith("."+x))) return false;
    const path=(p.pathname||"/").replace(/\/+$/,"/").toLowerCase();
    const q=(p.search||"").toLowerCase();
    if(h==="vanban.chinhphu.vn" && !/[?&]docid=\d+/.test(q)) return false;
    if(h==="vbpl.vn" && !/[?&]itemid=\d+/.test(q)) return false;
    if(h==="kcb.vn" && (/^\/van-ban\/?$/.test(path)||/van-ban-phap-quy\/?$/.test(path))) return false;
    if(h==="imda.moh.gov.vn" && /van-ban-phap-quy\/?$/.test(path)) return false;
    if(h==="moh.gov.vn" && /van-ban-phap-quy\/?$/.test(path)) return false;
    if(h==="congbao.chinhphu.vn" && (/\.rss$/.test(path)||/van-ban-dang-cong-bao/.test(path)||/cac-van-ban-moi/.test(path)||/tim-kiem/.test(path))) return false;
    if((h==="congbao.chinhphu.vn"||h.endsWith(".chinhphu.vn")) && path==="/" && !q) return false;
    return true;
  }catch{return false;}
}
function matchingStaticDoc(d){
  if(!d) return null;
  if(!d.auto && DOCS.some(x=>x.id===d.id)) return d;
  const codes=maGoc(d.code);
  return DOCS.find(x=>maGoc(x.code).some(c=>codes.includes(c))) || null;
}
function officialSourcesFor(d){
  const base=matchingStaticDoc(d);
  const mapped=base ? (OFFICIAL_BY_ID[base.id]||[]) : [];
  const candidates=[
    ...mapped,
    d?.sourceFile,
    d?.sourcePage,
    d?.src?.url,
    base?.src?.url
  ].filter(Boolean);
  const out=[];
  for(const u of candidates){
    if(isSpecificOfficialSource(u) && !out.includes(u)) out.push(u);
  }
  return out;
}
function officialSourceFor(d){ return officialSourcesFor(d)[0] || ""; }

let AUTO = [];
/* Gộp thẻ viết tay với dữ liệu máy quét.

   Bản trước cho thẻ tự động THAY THẾ thẳng thẻ viết tay cùng số hiệu. Thẻ viết
   tay được soạn từ việc đọc kỹ toàn văn nên thường đầy đủ hơn hẳn, nên mỗi lần
   máy quét chạm tới một văn bản đã có thẻ tay là nội dung công phu bị ghi đè
   bằng bản máy mỏng hơn — mất thông tin mà không ai biết.

   Nguyên tắc mới: thẻ viết tay là nền, dữ liệu máy chỉ BỒI THÊM. Máy đóng góp
   thứ nó làm tốt hơn người: tình trạng hiệu lực mới nhất, quan hệ thay thế và
   sửa đổi, trích dẫn nguyên văn kèm số điều, ngày đối chiếu gần nhất. Không có
   trường nào của thẻ tay bị xóa. */
function hopNhat(tay, may){
  const coHieuLuc = may.eff && !/chưa xác định/i.test(may.eff);
  return {
    ...tay,
    eff: coHieuLuc ? may.eff : tay.eff,
    essence: (tay.essence||"").length >= (may.essence||"").length ? tay.essence : may.essence,
    duties: (tay.duties||[]).length ? tay.duties : (may.duties||[]),
    risks:  (tay.risks ||[]).length ? tay.risks  : (may.risks ||[]),
    fine:     tay.fine     || may.fine     || "",
    fineNote: tay.fineNote || may.fineNote || "",
    claims:   may.claims   || [],
    steps:    may.steps    || [],
    cautions: may.cautions || [],
    thayThe:  may.thayThe  || [],
    suaDoi:   may.suaDoi   || [],
    checkedAt: may.checkedAt || "",
    stale: !!may.stale,
    sourcePage: may.sourcePage || "",
    sourceFile: may.sourceFile || "",
    doiChieu: true
  };
}

function allDocs(){
  const may = new Map();
  AUTO.forEach(v => maGoc(v.code).forEach(c => may.set(c, v)));

  const daDung = new Set();
  const ra = DOCS.map(d => {
    const m = maGoc(d.code).map(c => may.get(c)).find(Boolean);
    if(!m) return d;
    maGoc(d.code).forEach(c => daDung.add(c));
    maGoc(m.code).forEach(c => daDung.add(c));
    return hopNhat(d, m);
  });

  /* Văn bản máy tìm được mà bảng chưa có thẻ nào: đứng riêng thành thẻ mới. */
  return ra.concat(AUTO.filter(v => !maGoc(v.code).some(c => daDung.has(c))));
}

/* Bảng quan hệ hiệu lực do máy quét dựng: mã văn bản cũ -> bị văn bản nào thay thế hoặc sửa.
   Máy đọc điều khoản thi hành của văn bản mới rồi tự nối, người dùng không phải đối chiếu. */
let QUANHE = {};
function tinhQuanHe(d){
  for(const ma of maGoc(d.code)){ if(QUANHE[ma]) return QUANHE[ma]; }
  return null;
}


async function chep(text, nut){
  try{ await navigator.clipboard.writeText(text); }
  catch(e){
    const ta = document.createElement("textarea");
    ta.value = text; ta.style.position="fixed"; ta.style.opacity="0";
    document.body.appendChild(ta); ta.select();
    try{ document.execCommand("copy"); }catch(x){}
    document.body.removeChild(ta);
  }
  if(nut){ const cu = nut.textContent; nut.textContent = "Đã chép ✓";
    setTimeout(()=>{ nut.textContent = cu; }, 2000); }
}

/* Nạp văn bản đã được phân tích tự động, đưa vào đúng nhóm như văn bản viết tay */
async function napTuDong(){
  try{
    const ds = await jsonFetch("vanban-moi.json?t="+Date.now());
    if(!Array.isArray(ds)) throw Error("Sai định dạng dữ liệu");
    const nhomHopLe = new Set(CATS.map(c=>c.k));
    AUTO = ds.filter(v => v && v.verificationVersion===3 && v.verified===true && v.coToanVan && v.code && v.title && nhomHopLe.has(v.cat))
             
             .map(v => ({
      claims:v.claims||[], steps:v.steps||[], unknowns:v.unknowns||[], checkedAt:v.checkedAt, sourceFile:v.sourceFile, sourcePage:v.sourcePage,
      cautions: Array.isArray(v.cautions) ? v.cautions : [], stale: !!v.stale,
      id: "auto-" + v.code.replace(/[^0-9A-Za-z]/g,""),
      cat: v.cat,
      tier: [1,2,3].includes(v.tier) ? v.tier : 2,
      auto: true, flag: "",
      critical: !!v.critical || DOCS.some(d => maGoc(d.code).some(c => maGoc(v.code).includes(c)) && d.critical),
      criticalTitle: v.criticalTitle || (DOCS.find(d => maGoc(d.code).some(c => maGoc(v.code).includes(c)) && d.critical)?.criticalTitle || ""),
      criticalText: v.criticalText || (DOCS.find(d => maGoc(d.code).some(c => maGoc(v.code).includes(c)) && d.critical)?.criticalText || ""),
      title: v.title,
      code: v.code,
      eff: v.eff || "Máy quét tự cập nhật",
      fine: v.fine || "", fineNote: v.fineNote || "",
      essence: v.essence || "",
      duties: Array.isArray(v.duties) ? v.duties : [],
      risks:  Array.isArray(v.risks)  ? v.risks  : [],
      khongTraWeb: !!v.khongTraWeb && !v.coToanVan,
      coToanVan: !!v.coToanVan,
      notes: v.notes || "Nội dung đã được hệ thống đối chiếu với toàn văn từ nguồn chính thức.",
      bangChung: Array.isArray(v.bangChung) ? v.bangChung : [],
      tinCay: v.tinCay || "",
      thayThe: Array.isArray(v.thayThe) ? v.thayThe : [],
      suaDoi:  Array.isArray(v.suaDoi)  ? v.suaDoi  : [],
      src: { label: "Đọc nguồn chính thức", url: v.sourcePage || v.sourceFile || v.url || gsearch(v.code + " toàn văn") },
      q: v.code + " toàn văn"
    }));

    /* Nối quan hệ hiệu lực: văn bản mới khai tử hoặc sửa văn bản nào trong bảng thì đánh dấu
       ngay lên thẻ cũ. Nhờ vậy người dùng không phải tự biết văn bản nào đã chết. */
    QUANHE = {};
    AUTO.forEach(v => {
      (v.thayThe||[]).forEach(ma => { QUANHE[ma] = { kieu:"thay", boi:v.code, ten:v.title, id:v.id }; });
      (v.suaDoi||[]).forEach(ma => { if(!QUANHE[ma]) QUANHE[ma] = { kieu:"sua", boi:v.code, ten:v.title, id:v.id }; });
    });
    {
      demLaiNhom();
      render();
      renderCriticalAlert();
    }
  }catch(e){throw e;}
}

function demLaiNhom(){
  const tong = allDocs();
  [...$("#side").querySelectorAll(".nb")].forEach(b=>{
    const k = b.dataset.k;
    const n = k==="all" ? tong.length : tong.filter(d=>d.cat===k).length;
    const c = b.querySelector(".cnt"); if(c) c.textContent = n;
  });
}

function renderCriticalAlert(){
  const box = $("#criticalAlert");
  const candidates = allDocs().filter(d => d && d.critical === true);
  if(!candidates.length){ box.hidden = true; return; }
  const d = candidates.sort((a,b)=>a.tier-b.tier)[0];
  box.hidden = false;
  $("#criticalTitle").textContent = d.criticalTitle || d.title;
  $("#criticalText").textContent = d.criticalText || (d.risks && d.risks[0]) || d.essence || "";
  $("#criticalOpen").dataset.id = d.id;
}

/* ---- modal ---- */
let modalHistory = [];
let currentModalView = null;

function updateModalBack(){
  // Không hiển thị nút Back. Lịch sử chỉ dùng nội bộ để nút X quay về danh sách nguồn.
}
function setModalView(view){
  currentModalView = view;
  updateModalBack();
}
function rememberModalView(){
  if(!currentModalView) return;
  modalHistory.push({...currentModalView, scrollTop: $("#mBody").scrollTop || 0});
  updateModalBack();
}
function restoreModalView(view){
  if(!view) return;
  if(view.type === "risks") return openRisks(true, view.scrollTop || 0);
  if(view.type === "actions") return openActions(true, view.scrollTop || 0);
  if(view.type === "sources") return openSources(true, view.scrollTop || 0);
  if(view.type === "doc") return openDoc(view.id, true, view.scrollTop || 0);
}
function goModalBack(){
  const prev = modalHistory.pop();
  updateModalBack();
  if(prev) restoreModalView(prev);
}

function openModal(color, iconPath, title, metaHTML, bodyHTML, scrollTop=0){
  $("#mHead").style.setProperty("--nc", color);
  $("#mBody").style.setProperty("--nc", color);
  $("#mIcon").innerHTML = svg(iconPath,19);
  $("#mTitle").textContent = title;
  $("#mMeta").innerHTML = metaHTML;
  $("#mBody").innerHTML = bodyHTML;
  $("#modal").classList.add("on"); $("#scrim").classList.add("on");
  $("#mBody").scrollTop = 0;
  requestAnimationFrame(()=>{ $("#mBody").scrollTop = scrollTop || 0; });
  document.body.style.overflow="hidden";
}
function closeModal(){
  $("#modal").classList.remove("on"); $("#scrim").classList.remove("on"); document.body.style.overflow="";
  modalHistory = []; currentModalView = null; updateModalBack();
}

function closeCurrentModal(){
  // Nếu đang xem chi tiết văn bản được mở từ “Việc cần làm” hoặc “Rủi ro”,
  // nút X chỉ đóng lớp chi tiết và quay về đúng danh sách trước đó.
  if(currentModalView && currentModalView.type === "doc" && modalHistory.length){
    for(let i = modalHistory.length - 1; i >= 0; i--){
      const parent = modalHistory[i];
      if(parent && (parent.type === "actions" || parent.type === "risks")){
        modalHistory = modalHistory.slice(0, i);
        restoreModalView(parent);
        return;
      }
    }
  }
  // Ở chính danh sách hoặc khi mở văn bản trực tiếp từ trang chính: X đóng modal hoàn toàn.
  closeModal();
}


function buildAIPrompt(d){
  const sourceLinks = officialSourcesFor(d);
  const link = sourceLinks.length ? sourceLinks.map((u,i)=>`${i+1}. ${u}`).join('\n') : 'Chưa có đường dẫn nguồn cụ thể đã được xác nhận.';
  const nhom = CAT(d.cat).n;
  const duties = (d.duties||[]).map((x,i)=>`${i+1}. ${x}`).join('\n') || 'Chưa có.';
  const risks = (d.risks||[]).map((x,i)=>`${i+1}. ${x}`).join('\n') || 'Chưa có.';
  const claims = (d.claims||[]).map((x,i)=>`${i+1}. ${x.text} (${x.article})`).join('\n');
  return `Hãy đọc kỹ văn bản pháp luật ở link chính thức dưới đây, sau đó phân tích thật sâu, chính xác, dễ hiểu và dễ nhớ nhất cho người quản lý bệnh viện thẩm mỹ tư nhân.\n\nTHÔNG TIN VĂN BẢN\n- Tên văn bản: ${d.title}\n- Mã/số hiệu: ${d.code}\n- Nhóm: ${nhom}\n- Tình trạng/hiệu lực: ${d.eff}\n- Link nguồn chính thức: ${link}\n\nTÓM TẮT NHANH TỪ WEB (chỉ là dữ liệu đầu vào để đối chiếu lại với văn bản gốc, không được tin mù quáng)\n- Bản chất: ${d.essence || 'Chưa có.'}\n- Việc phải làm:\n${duties}\n- Rủi ro:\n${risks}${claims ? `\n- Một số nhận định đã có sẵn để đối chiếu:\n${claims}` : ''}\n\nYÊU CẦU PHÂN TÍCH\n1. Đọc link nguồn chính thức trước, không dựa vào trí nhớ.\n2. Xác nhận đây có phải văn bản còn hiệu lực hay đã bị thay thế/sửa đổi một phần/toàn bộ không. Nếu có văn bản thay thế/sửa đổi thì nêu rõ.\n3. Tóm tắt văn bản bằng ngôn ngữ cực dễ hiểu, ngắn gọn nhưng không sai bản chất.\n4. Giải thích bản chất cốt lõi: văn bản này thực sự đang quản cái gì, đánh vào rủi ro nào, và tinh thần quản lý là gì.\n5. Phân tích riêng theo góc nhìn bệnh viện thẩm mỹ tư nhân: quy định nào áp dụng trực tiếp, quy định nào không áp dụng, quy định nào cần đọc kèm văn bản khác.\n6. Bóc tách các nghĩa vụ cụ thể thành checklist hành động thực tế: việc phải làm ngay, việc phải chuẩn hóa trong 7 ngày, 30 ngày và duy trì định kỳ.\n7. Hướng dẫn từng bước để triển khai trong thực tế: ai làm, làm theo thứ tự nào, cần hồ sơ/chứng từ gì, bằng chứng lưu ở đâu.\n8. Chỉ ra các lỗi dễ hiểu sai, các bẫy pháp lý, các tình huống dễ bị xử phạt hoặc bị kết luận sai.\n9. Nếu có chế tài, hãy nêu đúng điều kiện áp dụng, đối tượng áp dụng, hành vi vi phạm, mức xử phạt và hậu quả bổ sung; không nói chung chung.\n10. Đề xuất phương án hành động tối ưu cho người vận hành bệnh viện: ưu tiên việc nào trước, việc nào giao bộ phận nào, cần kiểm tra nội bộ ra sao.\n11. Nếu văn bản còn điểm mơ hồ hoặc cần đối chiếu thêm luật/thông tư/nghị định khác thì liệt kê rõ ở cuối dưới mục “Cần kiểm tra thêm”.\n\nBỐ CỤC BẮT BUỘC CỦA CÂU TRẢ LỜI\nA. Kết luận cực ngắn (5-8 dòng)\nB. Văn bản này nói gì — tóm tắt dễ hiểu\nC. Bản chất cốt lõi cần nhớ\nD. Áp dụng gì cho bệnh viện thẩm mỹ tư nhân\nE. Checklist việc phải làm\nF. Hướng dẫn triển khai từng bước\nG. Rủi ro và lỗi dễ dính\nH. Chế tài/mức phạt (nếu có)\nI. Đề xuất hành động ưu tiên\nJ. Cần kiểm tra thêm\n\nYêu cầu cuối: viết rõ ràng, thực dụng, tuyệt đối tránh văn phong lý thuyết dài dòng.`;
}

let copyTimer = null;
function showCopyHint(msg){
  const box = $("#copyHint");
  if(!box) return;
  box.textContent = msg;
  box.classList.add("on");
  clearTimeout(copyTimer);
  copyTimer = setTimeout(()=>box.classList.remove("on"), 3200);
}

async function askAI(id, nut){
  const d = allDocs().find(x=>x.id===id);
  if(!d) return;
  await chep(buildAIPrompt(d), nut);
  showCopyHint('Câu lệnh đã được copy đầy đủ. Hãy dán vào ChatGPT để hỏi về văn bản pháp luật này');
}

function openDoc(id, keepHistory=false, scrollTop=0){
  const d = allDocs().find(x=>x.id===id); if(!d) return; const c = CAT(d.cat);
  if(!keepHistory) modalHistory = [];
  openModal(c.c, I[d.cat]||I.all, d.title,
    `<span class="tag ${TIER[d.tier].c}">${svg(TIER[d.tier].i,12)}${TIER[d.tier].n}</span>
     <span class="code">${esc(d.code)}</span>
     <span style="font-size:12.5px;color:var(--ink3)">${esc(d.eff)}</span>`,
    `${(()=>{ const q = tinhQuanHe(d); if(!q) return "";
        return `<div class="qhbox ${q.kieu==="sua"?"sua":""}">
          ${q.kieu==="thay"
            ? `<b>Văn bản này đã bị thay thế hoặc bãi bỏ.</b> Văn bản có hiệu lực thay thế là <b>${esc(q.boi)}</b>. Không sử dụng nội dung cũ làm căn cứ.`
            : `<b>Văn bản này đã được sửa đổi, bổ sung.</b> Văn bản sửa đổi là <b>${esc(q.boi)}</b>; phần sửa đổi được ưu tiên áp dụng theo văn bản mới.`}
          <br><button data-goto="${q.id}">Mở văn bản mới: ${esc(q.ten||q.boi)}</button>
        </div>`; })()}
     ${(d.auto||d.doiChieu)?`<div class="callout" data-t="3">Đã đối chiếu với toàn văn từ nguồn chính thức và kiểm tra lại từng trích dẫn bằng máy${d.checkedAt?`, lần gần nhất ${esc(ngayVN(d.checkedAt))}`:""}.</div>`:''}
     ${d.stale?'<div class="callout" data-t="2"><b>Đã quá 45 ngày chưa đối chiếu lại được với bản gốc.</b> Nội dung vẫn giữ nguyên để không bỏ sót, nhưng nên mở nguồn chính thức xác nhận trước khi dùng làm căn cứ.</div>':''}
     ${(d.cautions&&d.cautions.length)?`<div class="callout" data-t="2"><b>Điểm máy chưa tự xác nhận được (${d.cautions.length}):</b><ul style="margin:6px 0 0;padding-left:18px">${d.cautions.map(x=>`<li>${esc(x)}</li>`).join("")}</ul></div>`:''}
     ${(d.claims&&d.claims.length)?`<h4>Căn cứ theo từng nhận định</h4>${d.claims.map(x=>`<div class="evidence"><b>${esc(x.article)} · ${esc(x.kind==='fine'?'Mức phạt':x.kind==='effective'?'Hiệu lực':x.kind==='relation'?'Quan hệ văn bản':'Nội dung áp dụng')}</b><p>${esc(x.text)}</p>${x.subject?`<p>Đối tượng: ${esc(x.subject)} · Hành vi: ${esc(x.behavior)} · Điều kiện: ${esc(x.conditions)}</p>`:''}<blockquote>${esc(x.quote)}</blockquote></div>`).join('')}`:''}
     ${(d.steps&&d.steps.length)?`<h4>Khuyến nghị vận hành</h4>${d.steps.map(x=>`<div class="evidence"><b>${esc(x.action)}</b><p>Phụ trách: ${esc(x.owner)}</p><p>Hồ sơ cần lưu: ${esc(x.evidence)}</p><p>Khi nào: ${esc(x.when)}</p></div>`).join('')}`:''}
     ${d.fine?`<div class="fine"><span class="fi">${svg(I.risk,20)}</span><div><div class="n">${esc(d.fine)}</div><div class="l">${esc(d.fineNote||"")}</div></div></div>`:""}
     <h4>${svg('<circle cx="12" cy="12" r="9"/><path d="M12 16v-4M12 8h.01"/>',15)} Bản chất</h4>
     <p>${esc(d.essence)}</p>
     <h4>${svg(I.act,15)} Việc cụ thể phải làm</h4>
     <ul>${d.duties.map(x=>`<li>${esc(x)}</li>`).join("")}</ul>
     <h4>${svg(I.risk,15)} Rủi ro nếu làm sai</h4>
     <ul>${d.risks.map(x=>`<li>${esc(x)}</li>`).join("")}</ul>
     ${(d.bangChung&&d.bangChung.length)?`
       <h4>${svg('<path d="M7 8h10M7 12h10M7 16h6"/><rect x="3" y="3" width="18" height="18" rx="2"/>',15)}
         Trích nguyên văn từ bản gốc</h4>
       <p style="font-size:13px;color:var(--ink3);margin-bottom:6px">
         ${d.bangChung.length} đoạn dưới đây được máy đối chiếu và xác nhận có thật trong toàn văn.</p>
       ${d.bangChung.map(x=>`<div class="trich">“${esc(x)}”</div>`).join("")}`:""}
     ${d.auto&&d.notes?`<h4>${svg('<path d="M9 18h6M10 22h4"/><path d="M12 2a7 7 0 0 0-4 12.7V17h8v-2.3A7 7 0 0 0 12 2Z"/>',15)} Lưu ý thực chiến</h4><p>${esc(d.notes)}</p>`:""}
     <div class="links">
       ${officialSourceFor(d)
         ? `<a class="btn solid" href="${safeUrl(officialSourceFor(d))}" target="_blank" rel="noopener">${svg(I.src,15)} Mở nguồn chính thức</a>`
         : `<button class="btn solid" type="button" disabled title="Chưa xác nhận được đường dẫn tới đúng văn bản">${svg(I.src,15)} Nguồn đang được chuẩn hóa</button>`}
       <button class="btn askai" type="button" data-ai="${d.id}" aria-label="Hỏi ChatGPT">Hỏi ChatGPT</button>
     </div>`, scrollTop);
  setModalView({type:"doc", id:d.id});
}

function openActions(keepHistory=false, scrollTop=0){
  if(!keepHistory) modalHistory = [];
  /* Gộp cả khuyến nghị có cấu trúc của máy lẫn việc phải làm viết tay.
     Bản trước: hễ có khuyến nghị của máy là BỎ HẲN danh sách viết tay. Từ khi
     thẻ viết tay được máy đối chiếu bổ sung, luật nào cũng có khuyến nghị máy,
     nên 5 việc soạn tay có thể bị thay bằng 1 dòng máy — mất việc phải làm mà
     không ai nhận ra. Giờ hiển thị cả hai, chỉ bỏ dòng trùng chữ. */
  const items = allDocs().flatMap(d => {
    const steps = (Array.isArray(d.steps) ? d.steps : []).filter(x=>x && x.action);
    const daCo = new Set(steps.map(x=>String(x.action).trim().toLowerCase()));
    const duties = (d.duties||[]).filter(Boolean)
      .filter(x=>!daCo.has(String(x).trim().toLowerCase()));

    const chung = { id:d.id, code:d.code, title:d.title, cat:d.cat, tier:d.tier };
    return [
      ...steps.map((x,i)=>({
        action:x.action, owner:x.owner||"", evidence:x.evidence||"", when:x.when||"",
        ...chung, n:i, structured:true
      })),
      ...duties.map((action,i)=>({
        action, owner:"", evidence:"", when:"",
        ...chung, n:steps.length+i, structured:false
      }))
    ];
  }).sort((a,b)=>a.tier-b.tier || (CAT_ORDER[a.cat]??999)-(CAT_ORDER[b.cat]??999) || a.code.localeCompare(b.code));

  openModal("var(--brand)", I.act, "Việc cần làm",
    `<span style="font-size:12.5px;color:var(--ink3)">${items.length} việc được tổng hợp từ các văn bản đang theo dõi</span>`,
    items.length ? `<div class="rows">${items.map((a,i)=>{const c=CAT(a.cat);
      return `<button class="rowc" data-goto="${a.id}" style="--nc:${c.c}">
        <span class="num">${i+1}</span>
        <span style="flex:1 1 auto">
          <div class="rowtop">
            <p class="lawname">${esc(c.n)}</p>
            <span class="level ${TIER[a.tier].c}">${esc(TIER[a.tier].n)}</span>
          </div>
          <p class="docname">${esc(a.title)}</p>
          <p class="tt">${esc(a.action)}</p>
        </span></button>`;}).join("")}</div>`
      : `<p>Chưa có việc cụ thể để hiển thị.</p>`, scrollTop);
  setModalView({type:"actions"});
}

function openRisks(keepHistory=false, scrollTop=0){
  if(!keepHistory) modalHistory = [];
  const items = allDocs().flatMap(d => (d.risks||[]).map((text,i)=>({
    text, id:d.id, code:d.code, title:d.title, cat:d.cat, tier:d.tier, n:i
  }))).sort((a,b)=>a.tier-b.tier || (CAT_ORDER[a.cat]??999)-(CAT_ORDER[b.cat]??999) || a.code.localeCompare(b.code));
  openModal("var(--t1)", I.risk, "Rủi ro",
    `<span style="font-size:12.5px;color:var(--ink3)">${items.length} rủi ro có căn cứ từ các văn bản đã kiểm định</span>`,
    items.length ? `<div class="rows">${items.map((r,i)=>{const c=CAT(r.cat);
      return `<button class="rowc" data-goto="${r.id}" style="--nc:${c.c}">
        <span class="num">${i+1}</span>
        <span style="flex:1 1 auto">
          <div class="rowtop">
            <p class="lawname">${esc(c.n)}</p>
            <span class="level ${TIER[r.tier].c}">${esc(TIER[r.tier].n)}</span>
          </div>
          <p class="docname">${esc(r.title)}</p>
          <p class="tt">${esc(r.text)}</p>
        </span>
      </button>`;}).join("")}</div>`
      : `<p>Chưa có rủi ro cụ thể để hiển thị.</p>`, scrollTop);
  setModalView({type:"risks"});
}

function openSources(keepHistory=false, scrollTop=0){
  if(!keepHistory) modalHistory = [];
  openModal("var(--brand)", I.src, "Nguồn chính thống",
    `<span style="font-size:12.5px;color:var(--ink3)">${SOURCES.length} nhóm nguồn pháp lý được theo dõi</span>`,
    `<p>Hệ thống tự động đọc các nguồn chính thức và chỉ đưa nội dung đủ căn cứ lên giao diện. Có thể mở trực tiếp nguồn tại đây.</p>
     ${(()=>{ const s=SNAPSHOT; if(!s||!s.checkedAt) return "";
        const xong=Number(s.catalogDone||0), tong=Number(s.catalogTotal||0);
        const hong=Array.isArray(s.sourcesFailed)?s.sourcesFailed:[];
        return `<div class="callout" data-t="3">
          <b>Tình trạng máy đối chiếu</b><br>
          Lần chạy gần nhất: ${esc(s.gio||"")}.<br>
          ${tong?`Đã đối chiếu xong toàn văn ${xong}/${tong} văn bản nền tảng${xong<tong?", phần còn lại máy tiếp tục chạy mỗi giờ":""}.<br>`:""}
          Đọc được ${esc(String(s.sourcesOk??"?"))}/${esc(String(s.sourcesTotal??"?"))} nguồn.
          ${hong.length?`<br><span style="font-size:12.5px">Tạm thời chưa đọc được: ${hong.map(x=>esc(typeof x==="string"?x:(x.nguon+" ("+x.loi+")"))).join(", ")}.</span>`:""}
          <br><span style="font-size:12.5px">Các thẻ đang hiển thị không phụ thuộc vào việc này — chúng vẫn giữ nguyên nội dung đã kiểm.</span>
        </div>`; })()}
     <div class="rows">${SOURCES.map(s=>`<a class="srcrow" href="${s.u}" target="_blank" rel="noopener">
       <span style="color:var(--brand)">${svg(I.src,17)}</span>
       <span><span class="tt">${esc(s.n)}</span><br><span class="ss">${esc(s.d)}</span></span></a>`).join("")}</div>`, scrollTop);
  setModalView({type:"sources"});
}

/* ============================================================
   4. CẬP NHẬT — NGƯỜI DÙNG CHỈ BẤM MỘT NÚT
   ============================================================ */
let syncing=false;
function showState(message){$('#syncStatus').textContent=message;}

async function refreshSnapshot(fromButton=false){
  const before = SNAPSHOT?.checkedAt || '';
  const results=await Promise.allSettled([jsonFetch('capnhat.json?t='+Date.now()),napTuDong()]);
  if(results[0].status==='rejected'){
    showState('Chưa kết nối được dữ liệu mới nhất. Web vẫn giữ nội dung hiện có.');
    return false;
  }
  SNAPSHOT=results[0].value || {};
  /* Chấp nhận mọi phiên bản dữ liệu từ 3 trở lên.
     Bản trước so bằng đúng số 3, nên khi máy quét nâng lên số 4 thì điều kiện
     này vĩnh viễn sai: web hiển thị "Đang đồng bộ" mãi mãi dù đồng bộ vẫn chạy
     bình thường. Người dùng tưởng hệ thống treo trong khi nó đang chạy tốt. */
  const valid=Number(SNAPSHOT.schemaVersion)>=3 && SNAPSHOT.checkedAt;
  $('#lastUpd').textContent=valid?(SNAPSHOT.gio||SNAPSHOT.checkedAt):'Đang đồng bộ';
  if(valid){
    const same = before && before===SNAPSHOT.checkedAt;
    showState(fromButton && same
      ? `Đã là dữ liệu mới nhất · ${SNAPSHOT.gio||''}`
      : `Đã đồng bộ dữ liệu mới nhất · ${SNAPSHOT.gio||''}`);
  }else{
    showState('Hệ thống đang hoàn tất lần đồng bộ đầu tiên.');
  }
  if(results[1].status==='rejected'){
    showState('Đã kết nối trạng thái cập nhật nhưng chưa tải được nội dung mới. Web vẫn giữ dữ liệu hiện có.');
  }
  return true;
}

async function syncNow(){
  if(syncing) return;
  syncing=true;
  $('#scanBtn').disabled=true;
  showState('Đang lấy dữ liệu pháp lý mới nhất…');
  try{ await refreshSnapshot(true); }
  finally{ syncing=false; $('#scanBtn').disabled=false; }
}

const applyTheme=()=>{
  const saved=store.get('lawTheme');
  const rice=saved===null||saved===undefined||saved==='' ? true : saved==='rice';
  document.documentElement.dataset.theme=rice?'rice':'blue';
  document.querySelector('meta[name="theme-color"]').content=rice?'#483123':'#0F2C4D';
  const b=$('#themeBtn');
  if(b){
    b.setAttribute('aria-label',rice?'Chuyển sang giao diện xanh':'Chuyển sang giao diện be – nâu');
    b.setAttribute('title',rice?'Chuyển sang giao diện xanh':'Chuyển sang giao diện be – nâu');
  }
};
$('#themeBtn').onclick=()=>{
  const current=document.documentElement.dataset.theme==='rice'?'rice':'blue';
  store.set('lawTheme',current==='rice'?'blue':'rice');
  applyTheme();
};
applyTheme();
setInterval(()=>{if(!document.hidden&&!syncing)refreshSnapshot();},300000);
window.addEventListener('online',()=>refreshSnapshot());

/* ============================================================
   5. SỰ KIỆN
   ============================================================ */
const rail = $("#side");
function setRail(open){
  rail.classList.toggle("open", open);
  const t = $("#railTog"); if(t) t.setAttribute("aria-expanded", open);
}
$("#railTog").addEventListener("click", ()=> setRail(!rail.classList.contains("open")));
rail.addEventListener("click", e=>{
  const b = e.target.closest(".nb"); if(!b) return;
  cur = b.dataset.k;
  [...rail.querySelectorAll(".nb")].forEach(x=>x.setAttribute("aria-current", x===b));
  render();
  setRail(false);
  if(window.innerWidth < 960){
    const y = $("#secTitle").getBoundingClientRect().top + window.scrollY - 12;
    window.scrollTo({top:y, behavior: matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth"});
  }
});
document.addEventListener("click", e=>{
  if(rail.classList.contains("open") && !e.target.closest("nav.side")) setRail(false);
});
$("#q").addEventListener("input", e=>{ qtext = e.target.value; render(); });
$("#grid").addEventListener("click", e=>{
  const b = e.target.closest(".doc"); if(b) openDoc(b.dataset.id);
});
$("#mBody").addEventListener("click", e=>{
  const g = e.target.closest("[data-goto]");
  if(g){ rememberModalView(); openDoc(g.dataset.goto, true); return; }
  const a = e.target.closest("[data-ai]"); if(a){ askAI(a.dataset.ai, a); return; }
  const d = e.target.closest(".doc");
  if(d){ rememberModalView(); openDoc(d.dataset.id, true); return; }
});
document.querySelectorAll("[data-open]").forEach(b=>{
  b.addEventListener("click", ()=>({actions:openActions,risks:openRisks,sources:openSources})[b.dataset.open]());
});
$("#criticalOpen").addEventListener("click", e=>{ const id=e.currentTarget.dataset.id; if(id) openDoc(id); });
$("#scanBtn").addEventListener("click", syncNow);
$("#mClose").addEventListener("click", closeCurrentModal);
$("#scrim").addEventListener("click", closeModal);
document.addEventListener("keydown", e=>{ if(e.key==="Escape") closeModal(); });

render();
renderCriticalAlert();
refreshSnapshot();

/* ============================================================
   6. CÀI THÀNH APP + TỰ CẬP NHẬT
   ============================================================ */
if("serviceWorker" in navigator){
  window.addEventListener("load", ()=>{
    navigator.serviceWorker.register("./sw.js").then(reg=>{
      reg.addEventListener("updatefound", ()=>{
        const moi = reg.installing;
        if(!moi) return;
        moi.addEventListener("statechange", ()=>{
          // có bản mới và app đang chạy bản cũ -> nạp lại một lần, tự động
          if(moi.state==="installed" && navigator.serviceWorker.controller){
            moi.postMessage("capnhat");
          }
        });
      });
      setInterval(()=>reg.update(), 60*60*1000);   // mỗi giờ dò bản mới một lần
    }).catch(()=>{});
    let daNapLai = false;
    navigator.serviceWorker.addEventListener("controllerchange", ()=>{
      if(daNapLai) return; daNapLai = true; location.reload();
    });
  });
}

/* Chấm đỏ trên nút Cập nhật: đếm văn bản mới thật sự, ưu tiên thẻ AI đã phân tích.
   Chạy sau napTuDong nên AUTO đã có dữ liệu. */
(function moiCai(){
  const hop = $("#caidat");
  if(store.get("boQuaCai") === "1") return;
  const dangChayNhuApp = matchMedia("(display-mode: standalone)").matches || navigator.standalone === true;
  if(dangChayNhuApp) return;

  const iOS = /iphone|ipad|ipod/i.test(navigator.userAgent);
  let loiMoi = null;

  window.addEventListener("beforeinstallprompt", e=>{   // Android / Chrome
    e.preventDefault(); loiMoi = e;
    $("#caiTt").textContent = "Cài lên màn hình chính";
    $("#caiSs").textContent = "Mở nhanh như một ứng dụng, không cần gõ địa chỉ.";
    $("#caiGo").style.display = "";
    hop.classList.add("on");
  });

  if(iOS){                                              // iPhone / iPad: phải làm tay
    $("#caiTt").textContent = "Cài lên màn hình chính iPhone";
    $("#caiSs").innerHTML = "Bấm nút <b>Chia sẻ</b> ở thanh dưới Safari, kéo xuống chọn <b>Thêm vào MH chính</b>.";
    $("#caiGo").style.display = "none";
    setTimeout(()=>hop.classList.add("on"), 1800);
  }

  $("#caiGo").addEventListener("click", async ()=>{
    if(!loiMoi) return;
    hop.classList.remove("on");
    loiMoi.prompt();
    try{ await loiMoi.userChoice; }catch(e){}
    loiMoi = null;
  });
  $("#caiBo").addEventListener("click", ()=>{
    hop.classList.remove("on");
    store.set("boQuaCai","1");
  });
  window.addEventListener("appinstalled", ()=>{
    hop.classList.remove("on"); store.set("boQuaCai","1");
  });
})();
</script>
