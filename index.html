<!DOCTYPE html>
<html lang="vi" data-theme="rice">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Luật Việt Nam — Dành cho giám đốc điều hành bệnh viện thẩm mỹ</title>
<link rel="manifest" href="./manifest.json">
<meta name="theme-color" content="#483123">
<link rel="icon" type="image/png" sizes="192x192" href="./icon-192.png">
<link rel="apple-touch-icon" href="./icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Luật VN">
<meta name="mobile-web-app-capable" content="yes">
<style>
:root{
  --ink:#111C28; --ink2:#3D4C5A; --ink3:#71828F;
  --bg:#F4F6F8; --card:#FFFFFF; --line:#E2E8ED; --line2:#EEF2F5;
  --brand:#1B5FA8; --brand-d:#134580;
  --r:10px;
  --c-kcb:#E0453C; --c-dn:#2563EB; --c-pccc:#EA580C; --c-tb:#7C3AED;
  --c-mt:#16A34A; --c-ld:#0891B2; --c-dl:#DB2777; --c-ktd:#CA8A04; --c-qc:#0D9488;
  --c-duoc:#4338CA; --c-antt:#334155; --c-gia:#78350F;
  --t1:#DC2626; --t1b:#FEF2F2; --t2:#D97706; --t2b:#FFFBEB; --t3:#2563EB; --t3b:#EFF6FF;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Noto Sans",Arial,sans-serif;
  font-size:16px;line-height:1.55;-webkit-font-smoothing:antialiased}
a{color:var(--brand-d)}
button{font:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px;border-radius:4px}
svg{flex:0 0 auto}

/* ================= HEADER ================= */
header{background:linear-gradient(135deg,#0F2C4D 0%,#164A7E 55%,#1B6BA8 100%);color:#fff;position:relative;overflow:hidden}
header::after{content:"";position:absolute;right:-70px;top:-70px;width:260px;height:260px;border-radius:50%;background:rgba(255,255,255,.05)}
.hin{max-width:1240px;margin:0 auto;padding:16px 18px 14px 66px;position:relative;z-index:1}
@media(min-width:960px){.hin{padding-left:18px}}
.htop{display:flex;flex-wrap:wrap;gap:14px;align-items:flex-start;justify-content:space-between}
.brand{display:flex;gap:11px;align-items:center}
.blogo{width:40px;height:40px;border-radius:11px;background:rgba(255,255,255,.16);display:grid;place-items:center}
.brand h1{margin:0;font-size:23px;font-weight:700;letter-spacing:-.02em;line-height:1.1}
.brand p{margin:2px 0 0;font-size:12.5px;color:#B7D2E8}
.upd{display:flex;align-items:center;gap:10px;background:rgba(255,255,255,.11);border:1px solid rgba(255,255,255,.18);
  border-radius:12px;padding:7px 8px 7px 13px}
.upd .lbl{font-size:11px;color:#B7D2E8;line-height:1.3}
.upd .val{font-size:13.5px;font-weight:650;color:#fff}
.scanbtn{display:flex;align-items:center;gap:7px;background:#F5B700;color:#3A2A00;border:0;
  border-radius:9px;padding:9px 14px;font-size:13.5px;font-weight:700;white-space:nowrap}
.scanbtn:hover{background:#FFC722}
.scanbtn:disabled{opacity:.65;cursor:wait}
.scanbtn{position:relative}
.scanbtn .cham{position:absolute;top:-5px;right:-5px;min-width:20px;height:20px;border-radius:20px;
  background:#DC2626;color:#fff;font-size:11px;font-weight:800;display:none;align-items:center;
  justify-content:center;padding:0 5px;border:2px solid #164A7E;line-height:1}
.scanbtn .cham.on{display:flex}
.hnav{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:14px}
.hbtn{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;
  background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.24);
  color:#fff;border-radius:11px;padding:10px 6px;font-size:12.5px;font-weight:650;line-height:1.2;text-align:center}
.hbtn .bi{width:28px;height:28px;border-radius:9px;display:grid;place-items:center}
.hbtn:hover{background:rgba(255,255,255,.24)}
@media(min-width:520px){.hbtn{font-size:13.5px}}

/* ---- mời cài app ---- */
.caidat{position:fixed;left:12px;right:12px;bottom:14px;z-index:70;display:none;gap:12px;align-items:center;
  background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px 13px;
  box-shadow:0 10px 30px rgba(15,44,77,.24)}
.caidat.on{display:flex}
.caidat img{width:42px;height:42px;border-radius:11px;flex:0 0 auto}
.caidat .tt{font-size:14px;font-weight:700;line-height:1.3}
.caidat .ss{font-size:12.5px;color:var(--ink3);line-height:1.45;margin-top:2px}
.caidat .go{background:var(--brand);color:#fff;border:0;border-radius:9px;padding:9px 14px;
  font-size:13.5px;font-weight:700;white-space:nowrap}
.caidat .bo{background:none;border:0;color:var(--ink3);font-size:19px;line-height:1;padding:4px 2px}

/* ================= SHELL ================= */
.shell{max-width:1240px;margin:0 auto;padding:16px 18px 60px 66px;display:grid;gap:18px;grid-template-columns:1fr}
@media(min-width:960px){.shell{grid-template-columns:236px 1fr;align-items:start;padding:20px 18px 60px}}

/* ---- sidebar ---- */
/* ---- rail dọc cố định bên trái (điện thoại / tablet) ---- */
nav.side{position:fixed;left:6px;top:50%;transform:translateY(-50%);z-index:45;
  width:52px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:5px;
  display:flex;flex-direction:column;gap:3px;box-shadow:0 6px 22px rgba(15,44,77,.18);
  max-height:calc(100vh - 16px);max-height:calc(100dvh - 16px);overflow-y:auto;scrollbar-width:none;transition:width .18s ease}
nav.side::-webkit-scrollbar{display:none}
nav.side.open{width:214px}
@media(prefers-reduced-motion:reduce){nav.side{transition:none}}
.tog{display:flex;align-items:center;justify-content:center;gap:8px;background:var(--bg);border:0;
  border-radius:9px;padding:8px 4px;color:var(--ink2);width:100%;margin-bottom:2px}
.tog .tl{display:none;font-size:12.5px;font-weight:700}
nav.side.open .tog{justify-content:flex-start;padding-left:11px}
nav.side.open .tog .tl{display:inline}
.nb{display:flex;align-items:center;gap:10px;background:none;border:0;border-radius:9px;padding:5px 2px;
  color:var(--ink2);font-size:14px;font-weight:600;text-align:left;width:100%;justify-content:center}
.nb .ic{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;color:#fff;
  background:var(--nc,#94A3B8);flex:0 0 auto}
.nb .lb{display:none;flex:1 1 auto;font-size:13.5px;line-height:1.25}
.nb .cnt{display:none;font-size:11px;font-weight:700;color:var(--ink3);background:var(--line2);
  border-radius:20px;padding:1px 7px}
nav.side.open .nb{justify-content:flex-start;padding:5px 7px}
nav.side.open .nb .lb{display:block}
nav.side.open .nb .cnt{display:inline-block}
.nb[aria-current="true"]{background:#EAF1F7}
.nb[aria-current="true"] .ic{box-shadow:0 0 0 3px color-mix(in srgb, var(--nc) 28%, transparent)}
nav.side.open .nb[aria-current="true"]{background:var(--nc,#94A3B8);color:#fff}
nav.side.open .nb[aria-current="true"] .ic{background:rgba(255,255,255,.24);box-shadow:none}
nav.side.open .nb[aria-current="true"] .cnt{background:rgba(255,255,255,.24);color:#fff}
.nb:hover{background:#F2F6F9}

/* ---- máy tính: sidebar đầy đủ, không nổi ---- */
@media(min-width:960px){
  nav.side{position:sticky;top:16px;transform:none;width:auto;left:auto;border-radius:var(--r);
    box-shadow:none;padding:6px;gap:5px;max-height:none;overflow:visible}
  nav.side .tog{display:none}
  .nb{justify-content:flex-start;padding:9px 11px}
  .nb .lb{display:block}
  .nb .cnt{display:inline-block;margin-left:auto}
  .nb[aria-current="true"]{background:var(--nc,#94A3B8);color:#fff}
  .nb[aria-current="true"] .ic{background:rgba(255,255,255,.24);box-shadow:none}
  .nb[aria-current="true"] .cnt{background:rgba(255,255,255,.24);color:#fff}
}
.nb:hover{background:#F7FAFC}

/* ---- main ---- */
.hero{background:linear-gradient(135deg,#B91C1C 0%,#DC2626 55%,#EA580C 100%);border-radius:12px;
  padding:16px 17px;display:flex;gap:14px;align-items:flex-start;margin-bottom:16px;
  box-shadow:0 6px 18px rgba(220,38,38,.28);position:relative;overflow:hidden}
.hero::after{content:"";position:absolute;right:-40px;bottom:-50px;width:150px;height:150px;
  border-radius:50%;background:rgba(255,255,255,.09)}
.hero .hi{width:42px;height:42px;border-radius:12px;background:rgba(255,255,255,.22);color:#fff;
  display:grid;place-items:center;position:relative;z-index:1}
.hero .lb{display:inline-block;background:#FFD84D;color:#7A2E00;font-size:10.5px;font-weight:800;
  padding:2px 8px;border-radius:20px;margin-bottom:5px;letter-spacing:.02em}
.hero h2{margin:0 0 5px;font-size:15.5px;font-weight:750;color:#fff;position:relative;z-index:1}
.hero p{margin:0;font-size:14px;line-height:1.55;color:#FFE8E4;position:relative;z-index:1}
.hero b{color:#fff;font-weight:750}
.hero > div{position:relative;z-index:1}
.hero[hidden]{display:none!important}
.hero-copy{min-width:0}
.hero-open{margin-top:10px;border:1px solid rgba(255,255,255,.55);background:rgba(255,255,255,.14);color:#fff;border-radius:9px;padding:8px 11px;font:inherit;font-size:12.5px;font-weight:800;cursor:pointer}
.hero-open:active{transform:translateY(1px)}

.stitle{display:flex;align-items:center;gap:10px;margin:0 0 12px}
.stitle .ic{width:32px;height:32px;border-radius:9px;display:grid;place-items:center;color:#fff;background:var(--nc,#94A3B8)}
.stitle h2{margin:0;font-size:19px;font-weight:700;letter-spacing:-.015em}
.stitle p{margin:1px 0 0;font-size:12.5px;color:var(--ink3);font-weight:500}

.search{position:relative;margin-bottom:14px}
.search input{width:100%;padding:11px 13px 11px 40px;font-size:15px;font-family:inherit;color:var(--ink);
  background:var(--card);border:1px solid var(--line);border-radius:9px}
.search input::placeholder{color:#9AA9B4}
.search svg{position:absolute;left:13px;top:12px;color:#9AA9B4}

.grid{display:grid;gap:11px}
@media(min-width:640px){.grid{grid-template-columns:1fr 1fr}}
.doc{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px 15px;
  text-align:left;width:100%;position:relative;overflow:hidden;transition:border-color .12s,transform .12s}
.doc::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--nc,#94A3B8)}
.doc:hover{border-color:var(--nc,#94A3B8);transform:translateY(-1px)}
.doc .badges{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:9px}
.tag{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:750;padding:3px 9px;border-radius:20px}
.tag.t1{background:#DC2626;color:#fff;box-shadow:0 2px 6px rgba(220,38,38,.35)}
.tag.t2{background:#F59E0B;color:#422006;box-shadow:0 2px 6px rgba(245,158,11,.32)}
.tag.t3{background:#2563EB;color:#fff}
.tag.new{background:#10B981;color:#fff}
.tag.warn{background:#F97316;color:#fff}
.tag.auto{background:#7C3AED;color:#fff}
.tag.ok{background:#047857;color:#fff}
.tag.het{background:#111827;color:#fff}
.trich{background:#F8FAFC;border-left:3px solid var(--nc,#94A3B8);border-radius:0 8px 8px 0;
  padding:10px 12px;margin:8px 0;font-size:13.5px;line-height:1.6;color:var(--ink2);font-style:italic}
.qhbox{border-radius:9px;padding:11px 13px;margin:14px 0 0;font-size:13.5px;line-height:1.55;
  background:#111827;color:#fff}
.qhbox.sua{background:var(--t2b);color:#92400E;border-left:4px solid var(--t2)}
.qhbox b{font-weight:750}
.qhbox button{margin-top:8px;background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.3);
  color:#fff;border-radius:8px;padding:7px 12px;font-size:13px;font-weight:650}
.qhbox.sua button{background:#fff;border-color:var(--t2);color:#92400E}
.dhead{display:flex;gap:10px;align-items:flex-start;margin-bottom:7px}
.dic{width:32px;height:32px;border-radius:9px;background:var(--nc,#94A3B8);color:#fff;display:grid;place-items:center;flex:0 0 auto}
.doc h3{margin:0;font-size:15.5px;font-weight:650;line-height:1.35;letter-spacing:-.01em}
.doc .code{display:inline-block;font-size:11.5px;font-weight:700;color:var(--nc,#475569);background:#F5F8FA;
  border:1px solid var(--line);border-radius:5px;padding:1px 7px;font-variant-numeric:tabular-nums}
.doc .eff{font-size:12.5px;color:var(--ink3);margin-top:6px}
.moi{background:#FFFBEB;border:1.5px dashed #F59E0B;border-radius:var(--r);padding:13px 14px;
  text-align:left;width:100%;position:relative;margin-bottom:11px}
.moi:hover{border-color:#D97706;background:#FEF7E0}
.moi .h{display:flex;gap:9px;align-items:center;margin-bottom:7px}
.moi .h .ic{width:26px;height:26px;border-radius:8px;background:#F59E0B;color:#fff;display:grid;place-items:center;flex:0 0 auto}
.moi .h .lb{font-size:11px;font-weight:800;color:#92400E;letter-spacing:.02em}
.moi .cd{display:inline-block;font-size:12px;font-weight:800;color:#92400E;background:#FDE68A;
  border-radius:5px;padding:2px 8px;margin-bottom:6px}
.moi .tx{font-size:14px;line-height:1.5;color:#78350F}
.moihead{display:flex;align-items:center;gap:8px;margin:0 0 10px;font-size:13px;font-weight:750;color:#92400E}
.cham2{width:8px;height:8px;border-radius:50%;background:#DC2626;flex:0 0 auto;margin-left:4px;display:none}
.cham2.on{display:block}
.empty{background:var(--card);border:1px dashed var(--line);border-radius:var(--r);padding:30px 18px;
  text-align:center;color:var(--ink3);font-size:14px}

/* ================= MODAL ================= */
.scrim{position:fixed;inset:0;background:rgba(10,25,40,.6);z-index:80;opacity:0;pointer-events:none;transition:opacity .18s}
.scrim.on{opacity:1;pointer-events:auto}
.modal{position:fixed;z-index:90;left:0;right:0;bottom:0;max-height:92vh;background:var(--card);
  border-radius:16px 16px 0 0;transform:translateY(101%);transition:transform .24s cubic-bezier(.32,.72,0,1);
  display:flex;flex-direction:column}
.modal.on{transform:translateY(0)}
@media(prefers-reduced-motion:reduce){.modal,.scrim{transition:none}}
@media(min-width:820px){
  .modal{left:50%;right:auto;top:0;bottom:0;width:min(680px,100%);max-height:100vh;border-radius:0;
    transform:translate(-50%,101%)}
  .modal.on{transform:translate(-50%,0)}
}
.mhead{padding:16px 18px 13px;border-bottom:1px solid var(--line);display:flex;gap:12px;align-items:flex-start;
  background:var(--mh,#F7FAFC)}
.mhead .mi{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;color:#fff;background:var(--nc,#94A3B8)}
.mhead h2{margin:0 0 5px;font-size:17.5px;font-weight:700;line-height:1.3;letter-spacing:-.015em}
.x,.back{border:1px solid var(--line);background:#fff;border-radius:8px;width:32px;height:32px;font-size:16px;
  line-height:1;color:var(--ink2);display:grid;place-items:center;flex:0 0 auto}
.back{display:none;font-size:21px;font-weight:700}
.back.on{display:grid}
.mbody{overflow-y:auto;padding:2px 18px 26px;-webkit-overflow-scrolling:touch}
.mbody h4{display:flex;align-items:center;gap:7px;margin:20px 0 8px;font-size:13.5px;font-weight:700;color:var(--nc,var(--brand))}
.mbody p{margin:0 0 10px;font-size:14.5px;line-height:1.62;color:var(--ink2)}
.mbody ul{margin:0;padding-left:19px}
.mbody li{font-size:14.5px;line-height:1.6;color:var(--ink2);margin-bottom:8px}
.callout{border-radius:9px;padding:11px 13px;font-size:13.5px;line-height:1.55;margin:14px 0 0;
  border-left:4px solid var(--t3);background:var(--t3b);color:#1E40AF}
.callout[data-t="1"]{border-color:var(--t1);background:var(--t1b);color:#991B1B}
.callout[data-t="2"]{border-color:var(--t2);background:var(--t2b);color:#92400E}
.fine{background:linear-gradient(135deg,#BE123C,#E11D48);border:0;border-radius:12px;padding:14px 16px;margin:14px 0 0;
  display:flex;gap:13px;align-items:center;box-shadow:0 5px 14px rgba(190,18,60,.28)}
.fine .fi{width:38px;height:38px;border-radius:11px;background:rgba(255,255,255,.22);color:#fff;display:grid;place-items:center;flex:0 0 auto}
.fine .n{font-size:25px;font-weight:850;color:#fff;line-height:1.05;letter-spacing:-.025em}
.fine .l{font-size:12.5px;color:#FFDDE4;margin-top:3px;line-height:1.4}
.steps{list-style:none;margin:0;padding:0;counter-reset:s}
.steps li{counter-increment:s;position:relative;padding:0 0 14px 38px;font-size:14.5px;line-height:1.6;color:var(--ink2)}
.steps li::before{content:counter(s);position:absolute;left:0;top:0;width:26px;height:26px;border-radius:8px;
  background:var(--nc,var(--brand));color:#fff;font-size:13px;font-weight:700;display:grid;place-items:center}
.steps li b{color:var(--ink)}
.links{display:flex;flex-wrap:wrap;gap:8px;margin:20px 0 4px}
.btn{display:inline-flex;align-items:center;gap:7px;text-decoration:none;font-size:13.5px;font-weight:650;
  padding:10px 14px;border-radius:9px;border:1px solid var(--brand);color:var(--brand-d);background:#fff}
.btn.solid{background:var(--brand);border-color:var(--brand);color:#fff}
.btn.askai{display:inline-flex!important;align-items:center!important;justify-content:center!important;flex:0 0 auto!important;min-width:142px!important;width:auto!important;max-width:none!important;min-height:44px;text-align:center;white-space:nowrap!important;overflow:visible!important;line-height:1.2;font-weight:700}
.copyhint{position:fixed;left:50%;bottom:calc(105px + env(safe-area-inset-bottom));transform:translate(-50%,20px);opacity:0;z-index:120;background:rgba(34,27,22,.96);color:#fff;padding:12px 14px;border-radius:12px;box-shadow:0 10px 30px rgba(0,0,0,.25);font-size:13.5px;line-height:1.45;max-width:min(92vw,520px);pointer-events:none;transition:all .22s ease}
.copyhint.on{transform:translate(-50%,0);opacity:1}
.btn:hover{filter:brightness(1.06)}

/* ---- list rows inside modal ---- */
.rows{display:flex;flex-direction:column;gap:9px;margin-top:4px}
.rowc{display:flex;gap:12px;align-items:flex-start;background:#fff;border:1px solid var(--line);
  border-radius:10px;padding:12px 13px;text-align:left;width:100%}
.rowc:hover{border-color:var(--brand)}
.rowc .num{width:32px;height:32px;min-width:32px;flex:0 0 32px;border-radius:999px;background:var(--nc,var(--brand));color:#fff;
  font-size:13px;font-weight:700;display:grid;place-items:center;line-height:1}
.rowc .tt{font-size:14.5px;font-weight:700;line-height:1.42;margin:6px 0 0;color:var(--ink)}
.rowc .ss{font-size:12.5px;color:var(--ink3);line-height:1.45}
.rowc .rowtop{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:0 0 3px}
.rowc .lawname{font-size:13.5px;font-weight:800;line-height:1.35;color:var(--nc,var(--brand));margin:0}
.rowc .level{flex:0 0 auto;font-size:10.5px;font-weight:800;line-height:1;padding:5px 8px;border-radius:999px;white-space:nowrap}
.rowc .level.t1{background:#FEE2E2;color:#B91C1C}
.rowc .level.t2{background:#FEF3C7;color:#92400E}
.rowc .level.t3{background:#DBEAFE;color:#1D4ED8}
.rowc .docname{font-size:13px;font-weight:500;line-height:1.4;color:var(--ink3);margin:0}
.freq{display:inline-block;font-size:11px;font-weight:700;padding:2px 8px;border-radius:20px;
  background:#EEF2F5;color:var(--ink2);margin-bottom:5px}
.srcrow{display:flex;gap:12px;align-items:center;background:#fff;border:1px solid var(--line);
  border-radius:10px;padding:12px 13px;text-decoration:none;color:var(--ink)}
.srcrow:hover{border-color:var(--brand);background:#F8FBFD}
.srcrow .tt{font-size:14.5px;font-weight:650}
.srcrow .ss{font-size:12.5px;color:var(--ink3)}

/* ---- scan ---- */
.bar{height:7px;background:var(--line2);border-radius:20px;overflow:hidden;margin:6px 0 16px}
.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#1B6BA8,#5BB0E8);transition:width .3s}

   "Bác sĩ hết hạn giấy phép hành nghề mà vẫn đứng bàn mổ khiến cả cơ sở chịu trách nhiệm."],
 notes:"Đọc bản hợp nhất 26/VBHN-VPQH thay vì bản 2023 gốc, vì bản gốc chưa có hai lần sửa đổi năm 2025.",
 src:{label:"Công báo Chính phủ",url:"https://congbao.chinhphu.vn/van-ban/van-ban-hop-nhat-so-26-vbhn-vpqh-469053/63165.htm"},
 q:"Văn bản hợp nhất 26/VBHN-VPQH Luật Khám bệnh chữa bệnh"},

{id:"nd96",cat:"kcb",tier:1,
 title:"Quy định chi tiết Luật Khám bệnh, chữa bệnh — ranh giới ngành thẩm mỹ",
 code:"96/2023/NĐ-CP", eff:"Ban hành 30/12/2023",
 essence:"Nghị định này chứa điều khoản quan trọng nhất với ngành thẩm mỹ: khoản 12 Điều 40. Nó vẽ ranh giới giữa cơ sở làm đẹp thường và cơ sở khám chữa bệnh.",
 duties:["Ghi nhớ ranh giới: dịch vụ thẩm mỹ có dùng thuốc, chất hoặc thiết bị can thiệp vào cơ thể người — phẫu thuật, thủ thuật, tiêm, chích, bơm, chiếu tia, sóng, đốt hoặc can thiệp xâm lấn khác — chỉ được làm tại bệnh viện, phòng khám đa khoa hoặc phòng khám chuyên khoa.",
   "Xăm, phun, thêu trên da có dùng thuốc gây tê dạng tiêm cũng rơi vào nhóm phải là cơ sở khám chữa bệnh. Không dùng thuốc tê tiêm thì chỉ cần đăng ký kinh doanh và chứng chỉ đào tạo nghề.",
   "Kiểm tra mọi dịch vụ đang bán trên website và bảng giá, phân loại từng cái vào đúng bên của ranh giới.",
   "Lưu đủ chứng chỉ hoặc giấy chứng nhận đào tạo nghề của từng kỹ thuật viên phun xăm."],
 risks:["Đây là điều khoản thanh tra dùng để kết luận một cơ sở đã lấn sang hoạt động khám chữa bệnh không phép — chế tài là đình chỉ, không chỉ phạt tiền.",
   "Rủi ro hay bị bỏ qua: bộ phận spa hoặc chăm sóc da trong cùng tòa nhà lặng lẽ làm tiêm hoặc chiếu tia dưới danh nghĩa dịch vụ không xâm lấn."],
 notes:"Nghị định 96/2023 đã bỏ nhóm cơ sở thẩm mỹ phi y tế ra khỏi phạm vi điều chỉnh. Nếu bệnh viện có chi nhánh phun xăm riêng, nên hỏi Sở Y tế Hà Nội bằng văn bản thay vì suy đoán.",
 src:{label:"Toàn văn trên Cổng Xây dựng chính sách",url:"https://xaydungchinhsach.chinhphu.vn/toan-van-nghi-dinh-quy-dinh-chi-tiet-mot-so-dieu-cua-luat-kham-benh-chua-benh-119240115115947657.htm"},
 q:"khoản 12 Điều 40 Nghị định 96/2023/NĐ-CP dịch vụ thẩm mỹ"},

{id:"tt23",cat:"kcb",tier:2,
 title:"Danh mục kỹ thuật trong khám bệnh, chữa bệnh",
 code:"23/2024/TT-BYT", eff:"Bộ Y tế ban hành năm 2024",
 essence:"Từ điển chuẩn để đối chiếu: kỹ thuật bệnh viện đang làm có tên trong danh mục không, và có nằm trong phạm vi chuyên môn được duyệt không.",
 duties:["Lập bảng đối chiếu ba cột: dịch vụ đang bán — tên kỹ thuật theo danh mục — đã có trong phạm vi chuyên môn được duyệt hay chưa.",
   "Kỹ thuật mới phải làm thủ tục bổ sung phạm vi trước khi thực hiện ca đầu tiên, không làm ngược lại."],
 risks:["Triển khai kỹ thuật chưa được phê duyệt là vi phạm về chuyên môn kỹ thuật, chế tài nằm ở Nghị định 90/2026."],
 notes:"", src:{label:"Cục Quản lý Khám, chữa bệnh",url:"https://kcb.vn/van-ban/van-ban-phap-quy"},
 q:"Thông tư 23/2024/TT-BYT danh mục kỹ thuật khám bệnh chữa bệnh"},

{id:"tt35",cat:"kcb",tier:2,
 title:"Tiêu chuẩn chất lượng cơ bản đối với bệnh viện",
 code:"35/2024/TT-BYT", eff:"Bộ Y tế ban hành năm 2024",
 essence:"Đặt sàn chất lượng phải duy trì liên tục, không chỉ tại thời điểm xin phép. Đây là bộ tiêu chí thanh tra dùng để chấm khi kiểm tra định kỳ.",
 duties:["Tự đánh giá theo bộ tiêu chuẩn ít nhất một lần mỗi năm và lưu hồ sơ tự đánh giá.",
   "Gắn kết quả tự đánh giá với kế hoạch cải tiến có người chịu trách nhiệm và mốc thời gian."],
 risks:["Không có hồ sơ tự đánh giá là điểm trừ đầu tiên trong mọi đợt kiểm tra chất lượng."],
 notes:"Cần đối chiếu bản mới nhất trên cổng Bộ Y tế — thông tư chất lượng bệnh viện được sửa khá thường xuyên.",
 src:{label:"Cục Quản lý Khám, chữa bệnh",url:"https://kcb.vn/van-ban/van-ban-phap-quy"},
 q:"Thông tư 35/2024/TT-BYT tiêu chuẩn chất lượng cơ bản đối với bệnh viện"},

{id:"nd148",cat:"kcb",tier:3,
 title:"Phân quyền, phân cấp trong lĩnh vực y tế",
 code:"148/2025/NĐ-CP", eff:"Hiệu lực 01/7/2025",
 essence:"Không tạo nghĩa vụ mới nhưng đổi địa chỉ nộp hồ sơ. Nhiều thẩm quyền trước ở Bộ Y tế nay chuyển xuống Sở Y tế và cơ sở y tế.",
 duties:["Trước khi nộp hồ sơ gia hạn, điều chỉnh phạm vi chuyên môn hay bổ sung kỹ thuật, xác nhận lại cơ quan có thẩm quyền hiện tại.",
   "Cập nhật danh bạ đầu mối liên hệ tại Sở Y tế Hà Nội."],
 risks:["Nộp nhầm cấp làm chậm thủ tục, kéo theo giấy phép hết hạn trong lúc chờ."],
 notes:"", src:{label:"Cục Quản lý Khám, chữa bệnh",url:"https://kcb.vn/van-ban/van-ban-phap-quy"},
 q:"Nghị định 148/2025/NĐ-CP phân quyền phân cấp lĩnh vực y tế"},

{id:"tt38",cat:"kcb",tier:3,
 title:"Hệ thống thông tin quản lý hoạt động khám bệnh, chữa bệnh",
 code:"38/2024/TT-BYT", eff:"Bộ Y tế ban hành năm 2024",
 essence:"Cơ sở khám chữa bệnh phải kết nối và gửi dữ liệu hoạt động lên hệ thống của ngành. Đây là nền cho việc hậu kiểm bằng dữ liệu thay vì kiểm tra thực địa.",
 duties:["Xác nhận phần mềm bệnh viện đã kết nối và gửi dữ liệu đúng chuẩn.",
   "Cử một đầu mối chịu trách nhiệm về tính đúng của dữ liệu gửi đi."],
 risks:["Sai lệch giữa dữ liệu gửi lên hệ thống và hồ sơ bệnh án thực tế rất khó giải thích khi bị hậu kiểm."],
 notes:"", src:{label:"Cục Quản lý Khám, chữa bệnh",url:"https://kcb.vn/van-ban/van-ban-phap-quy"},
 q:"Thông tư 38/2024/TT-BYT hệ thống thông tin quản lý khám bệnh chữa bệnh"},

{id:"tt13bade",cat:"kcb",tier:1,flag:"warn",
 title:"Hồ sơ bệnh án điện tử — thời hạn bắt buộc đã qua",
 code:"13/2025/TT-BYT", eff:"Ban hành 06/6/2025 · hiệu lực 21/7/2025 · thay thế Thông tư 46/2018/TT-BYT",
 essence:"Thông tư buộc cơ sở được cấp giấy phép hoạt động dạng bệnh viện phải triển khai hồ sơ bệnh án điện tử chậm nhất ngày 30/9/2025. Mốc này đã trôi qua. Cơ sở chưa làm là đang ở trạng thái không tuân thủ, và bằng chứng nằm sẵn trong chính hệ thống dữ liệu của bệnh viện.",
 duties:["Xác định ngay bệnh viện đã triển khai hồ sơ bệnh án điện tử đúng quy định chưa. Đây là việc kiểm tra đầu tiên trong toàn bộ bảng này vì thời hạn đã quá gần một năm.",
   "Bảo đảm hạ tầng công nghệ thông tin theo yêu cầu: máy trạm, hạ tầng mạng, máy chủ, giải pháp lưu trữ kèm lưu trữ dự phòng.",
   "Nội dung hồ sơ bệnh án điện tử phải có đầy đủ thông tin theo Chương X Thông tư 32/2023/TT-BYT.",
   "Bảo đảm khả năng phục hồi và truy xuất dữ liệu phục vụ điều trị, thanh tra kiểm tra và nghiên cứu.",
   "Các cơ sở khám chữa bệnh khác có điều trị nội trú, ban ngày hoặc ngoại trú có hạn chót muộn hơn là 31/12/2026."],
 risks:["Chưa triển khai sau ngày 30/9/2025 là vi phạm đã quá hạn, không thể giải thích bằng lý do kỹ thuật vì thời gian chuẩn bị đã hết.",
   "Hậu kiểm bằng dữ liệu dễ hơn kiểm tra thực địa rất nhiều, nên đây là loại vi phạm khó giấu nhất.",
   "Bệnh án giấy song song với bệnh án điện tử không khớp nhau sẽ thành điểm yếu chí mạng khi có sự cố y khoa và bị trưng cầu giám định."],
 notes:"Lưu ý khi tra cứu: trang benhandientu.moh.gov.vn của Bộ Y tế tính tới nay vẫn liệt kê Thông tư 46/2018 là văn bản có hiệu lực và chưa cập nhật Thông tư 13/2025. Đó là trang chưa được cập nhật chứ không phải bằng chứng 46/2018 còn hiệu lực. Căn cứ đúng để trích dẫn là Thông tư 13/2025/TT-BYT.",
 src:{label:"Toàn văn Thông tư 13/2025/TT-BYT",url:"https://thuvienphapluat.vn/van-ban/The-thao-Y-te/Thong-tu-13-2025-TT-BYT-huong-dan-trien-khai-ho-so-benh-an-dien-tu-660113.aspx"},
 q:"Thông tư 13/2025/TT-BYT hồ sơ bệnh án điện tử lộ trình bắt buộc"},

{id:"tt16ksnk",cat:"kcb",tier:1,
 title:"Kiểm soát nhiễm khuẩn trong cơ sở khám chữa bệnh",
 code:"16/2018/TT-BYT", eff:"Ban hành 20/7/2018 · hiệu lực 01/10/2018 · thay thế Thông tư 18/2009/TT-BYT",
 essence:"Với một cơ sở có phẫu thuật và thủ thuật xâm lấn, kiểm soát nhiễm khuẩn không phải thủ tục giấy tờ mà là điều kiện hoạt động. Đây cũng là gốc rễ của phần lớn tai biến nhiễm trùng sau can thiệp thẩm mỹ, thứ dẫn thẳng tới khiếu kiện và khủng hoảng truyền thông.",
 duties:["Tổ chức giám sát nhiễm khuẩn bệnh viện: thu thập, phân tích, phiên giải số liệu và báo cáo kịp thời, không chỉ ghi chép cho có.",
   "Thực hiện quy định vệ sinh tay, cung cấp đủ hóa chất và phương tiện ngay tại nơi chăm sóc người bệnh.",
   "Cơ sở từ 150 giường kế hoạch trở lên phải thiết lập đủ hệ thống: hội đồng kiểm soát nhiễm khuẩn, khoa hoặc bộ phận kiểm soát nhiễm khuẩn, mạng lưới kiểm soát nhiễm khuẩn, có người chuyên trách đã được đào tạo.",
   "Xây dựng và cập nhật các quy trình chuyên môn về khử khuẩn, tiệt khuẩn dụng cụ, xử lý đồ vải và kiểm soát môi trường buồng phẫu thuật.",
   "Đối chiếu quy mô giường bệnh thực tế của bệnh viện để biết mình rơi vào nhóm yêu cầu nào."],
 risks:["Thiếu hệ thống kiểm soát nhiễm khuẩn theo quy mô là vi phạm điều kiện hoạt động, chế tài nằm ở nhóm nặng chứ không phải phạt hành chính thông thường.",
   "Khi có ca nhiễm trùng sau phẫu thuật, hồ sơ kiểm soát nhiễm khuẩn là thứ đầu tiên cơ quan điều tra yêu cầu. Không có hồ sơ đồng nghĩa với suy đoán bất lợi.",
   "Dụng cụ tái sử dụng không có nhật ký tiệt khuẩn là lỗ hổng phổ biến nhất ở cơ sở thẩm mỹ tư nhân."],
 notes:"Đã kiểm chứng ngày 09/09/2026: thông tư này chưa bị thay thế sau Luật Khám bệnh chữa bệnh 2023, không nằm trong danh mục văn bản hết hiệu lực tại Quyết định 134/QĐ-BYT ngày 15/01/2026. Hướng dẫn chuyên môn đi kèm là Quyết định 3916/QĐ-BYT.",
 src:{label:"Toàn văn trên Công báo Chính phủ",url:"https://congbao.chinhphu.vn/van-ban/thong-tu-so-16-2018-tt-byt-27152.htm"},
 q:"Thông tư 16/2018/TT-BYT kiểm soát nhiễm khuẩn cơ sở khám bệnh chữa bệnh"},

{id:"tt43sco",cat:"kcb",tier:2,
 title:"Phòng ngừa sự cố y khoa và an toàn người bệnh",
 code:"43/2018/TT-BYT", eff:"Ban hành 26/12/2018 · hiệu lực 01/3/2019",
 essence:"Bảng này đã có mục việc cần làm về xử lý sự cố y khoa, nhưng đây mới là văn bản gốc đứng sau nó. Thông tư quy định cách phát hiện, báo cáo, phân loại và phòng ngừa sự cố, tức là biến việc xử lý khủng hoảng từ phản xạ cá nhân thành quy trình có hồ sơ.",
 duties:["Thiết lập cơ chế phát hiện, báo cáo và phân loại sự cố y khoa, thực hiện báo cáo định kỳ và đột xuất theo hướng dẫn của thông tư.",
   "Đánh giá, xác định và ưu tiên xử lý các nguy cơ mất an toàn người bệnh thay vì chỉ xử lý khi đã xảy ra hậu quả.",
   "Rà soát và cập nhật định kỳ các quy trình kỹ thuật trọng yếu: cấp cứu, sàng lọc trước can thiệp, kiểm soát nhiễm khuẩn, quản lý và sử dụng thuốc.",
   "Đào tạo nhân viên về an toàn người bệnh và khuyến khích báo cáo tự nguyện, vì sự cố bị giấu là sự cố sẽ lặp lại."],
 risks:["Không có hệ thống báo cáo sự cố khiến bệnh viện mất khả năng phát hiện sớm, và mọi vụ việc đều nổ ra ở mức nghiêm trọng nhất.",
   "Khi cơ quan điều tra vào cuộc, việc cơ sở chưa từng ghi nhận sự cố nào tương tự trước đó là tình tiết bất lợi chứ không phải bằng chứng tốt."],
 notes:"Tên chính thức là hướng dẫn phòng ngừa sự cố y khoa. Bộ Y tế vẫn viện dẫn thông tư này làm căn cứ trong Công văn 2100/BYT-KCB ngày 24/4/2024 về chấn chỉnh quản lý an toàn người bệnh, nên tại thời điểm kiểm chứng 09/09/2026 văn bản còn hiệu lực.",
 src:{label:"Toàn văn Thông tư 43/2018/TT-BYT",url:"https://thuvienphapluat.vn/van-ban/The-thao-Y-te/Thong-tu-43-2018-TT-BYT-huong-dan-phong-ngua-su-co-y-khoa-trong-co-so-kham-benh-chua-benh-366845.aspx"},
 q:"Thông tư 43/2018/TT-BYT phòng ngừa sự cố y khoa an toàn người bệnh"},

{id:"tt32cme",cat:"kcb",tier:2,
 title:"Cập nhật kiến thức y khoa liên tục — điều kiện gia hạn giấy phép hành nghề",
 code:"32/2023/TT-BYT · Điều 3", eff:"Ban hành 31/12/2023 · hiệu lực 01/01/2024",
 essence:"Giấy phép hành nghề có thời hạn 5 năm, và điều kiện để gia hạn là người hành nghề phải tích lũy đủ giờ cập nhật kiến thức y khoa liên tục. Bệnh viện không theo dõi việc này thì tới hạn mới phát hiện bác sĩ không đủ điều kiện gia hạn, lúc đó không kịp bù.",
 duties:["Mỗi người hành nghề phải tham gia tối thiểu 120 giờ tín chỉ trong 05 năm liên tục. Một giờ tín chỉ tương đương một tiết học của khóa đào tạo ngắn hạn.",
   "Bệnh viện phải tạo điều kiện, theo dõi và quản lý hoạt động cập nhật kiến thức của người hành nghề, lưu trữ hồ sơ và chương trình đào tạo.",
   "Lập bảng theo dõi số giờ tích lũy của từng người, gắn với bảng theo dõi hạn giấy phép hành nghề đã có trong mục việc cần làm.",
   "Nếu bệnh viện tự tổ chức khóa cập nhật kiến thức, phải báo cáo kế hoạch đào tạo về Bộ Y tế hoặc Sở Y tế trước khi tổ chức và cấp giấy chứng nhận hoàn thành."],
 risks:["Người hành nghề không đủ 120 giờ khi tới hạn thì không gia hạn được giấy phép, và bệnh viện mất nhân sự đột ngột ở vị trí có thể là người chịu trách nhiệm chuyên môn.",
   "Không có hồ sơ theo dõi là bệnh viện đang phó mặc điều kiện hành nghề cho từng cá nhân tự lo."],
 notes:"Không bắt buộc phân bổ đều theo từng năm, được linh hoạt trong chu kỳ 5 năm. Hình thức hợp lệ gồm khóa đào tạo, hội thảo hội nghị ngắn hạn, biên soạn tài liệu giáo trình y khoa, nghiên cứu khoa học, giảng dạy và tự học.",
 src:{label:"Điều kiện gia hạn giấy phép hành nghề y",url:"https://baochinhphu.vn/dieu-kien-gia-han-giay-phep-hanh-nghe-y-102240325171247213.htm"},
 q:"Thông tư 32/2023/TT-BYT cập nhật kiến thức y khoa liên tục 120 giờ tín chỉ"},

{id:"tt33luu",cat:"kcb",tier:3,flag:"new",
 title:"Thời hạn lưu trữ hồ sơ bệnh án và tài liệu y tế",
 code:"33/2025/TT-BYT", eff:"Ban hành 01/7/2025 · hiệu lực 01/7/2025 · thay thế Thông tư 53/2017/TT-BYT",
 essence:"Mốc lưu trữ quen thuộc 10, 15, 20 năm mà nhiều cơ sở vẫn dùng đến từ Quy chế bệnh viện năm 1997, và quy chế đó đã bị bãi bỏ. Đây là văn bản đang có hiệu lực, áp dụng cho cả tài liệu giấy, tài liệu trên vật mang tin và tài liệu điện tử.",
 duties:["Áp dụng thời hạn lưu trữ theo Phụ lục của thông tư: hồ sơ bệnh án nội trú và ngoại trú thông thường 10 năm; hồ sơ bệnh án tâm thần, tai nạn lao động, tai nạn giao thông 20 năm; hồ sơ bệnh án người bệnh tử vong 30 năm; hồ sơ giám định pháp y và giám định pháp y tâm thần 70 năm; giấy khám sức khỏe 02 năm; hồ sơ sức khỏe điện tử 10 năm sau khi người dân qua đời.",
   "Chú ý riêng mốc 30 năm với hồ sơ người bệnh tử vong, đây là điểm tăng so với thói quen cũ 20 năm và là loại sai sót tốn kém nếu tiêu hủy sớm.",
   "Xây dựng và duy trì hệ thống lưu trữ đáp ứng đúng thời hạn theo từng nhóm hồ sơ, bảo đảm truy xuất được suốt thời hạn đó.",
   "Rà lại quy chế lưu trữ nội bộ nếu nó còn viện dẫn Quyết định 1895/1997/QĐ-BYT — quy chế đó đã bị Thông tư 18/2024/TT-BYT bãi bỏ từ 01/10/2024."],
 risks:["Tiêu hủy hồ sơ sớm hơn thời hạn là hành vi không thể khắc phục, và trong vụ việc có tai biến thì mất hồ sơ đồng nghĩa mất bằng chứng bảo vệ chính mình.",
   "Nhiều trang tra cứu phổ biến vẫn trích Quy chế bệnh viện 1997 làm căn cứ hiện hành. Làm theo là làm theo văn bản đã chết."],
 notes:"Đã kiểm chứng ngày 09/09/2026 qua hai nguồn độc lập khớp nhau về các con số trong Phụ lục. Chưa đối chiếu được trực tiếp bản PDF Phụ lục trên vanban.chinhphu.vn vì trang chặn tải tự động, nên trước khi tiêu hủy bất kỳ hồ sơ nào cần mở Phụ lục gốc xác nhận lại đúng dòng áp dụng.",
 src:{label:"Toàn văn trên Cổng văn bản Chính phủ",url:"https://vanban.chinhphu.vn/?pageid=27160&docid=214427"},
 q:"Thông tư 33/2025/TT-BYT thời hạn lưu trữ hồ sơ bệnh án phụ lục"},

{id:"bhtnnn",cat:"kcb",tier:2,flag:"warn",
 title:"Bảo hiểm trách nhiệm nghề nghiệp trong khám chữa bệnh",
 code:"Điều 103 Luật Khám bệnh, chữa bệnh 15/2023/QH15", eff:"Luật ban hành 09/01/2023 · hiệu lực 01/01/2024",
 essence:"Bảo hiểm trách nhiệm nghề nghiệp là thứ chi trả bồi thường khi xảy ra tai biến y khoa. Với bệnh viện thẩm mỹ, đây là tấm đệm tài chính giữa một ca hỏng và việc phải bán tài sản để bồi thường. Điều 103 xác lập nghĩa vụ, giao Chính phủ quy định chi tiết.",
 duties:["Kiểm tra bệnh viện hiện có hợp đồng bảo hiểm trách nhiệm nghề nghiệp còn hiệu lực hay không, và mức trách nhiệm bảo hiểm là bao nhiêu cho mỗi vụ khiếu nại.",
   "Đối chiếu phạm vi bảo hiểm với danh mục kỹ thuật bệnh viện đang thực hiện thực tế. Hợp đồng loại trừ đúng nhóm kỹ thuật rủi ro cao thì tấm đệm đó là giả.",
   "Cung cấp đầy đủ và trung thực thông tin cho doanh nghiệp bảo hiểm, đóng phí đúng hạn, thông báo kịp thời khi có thay đổi làm tăng hoặc giảm rủi ro.",
   "Đưa việc gia hạn hợp đồng bảo hiểm vào cùng bảng theo dõi hạn với giấy phép hoạt động và giấy phép hành nghề."],
 risks:["Không có bảo hiểm trách nhiệm nghề nghiệp thì toàn bộ bồi thường dân sự khi có tai biến rơi thẳng vào bệnh viện.",
   "Có hợp đồng nhưng loại trừ đúng kỹ thuật gây tai biến là tình huống tệ nhất: vừa mất phí vừa không được chi trả."],
 notes:"Cần xác minh trước khi trích dẫn văn bản hướng dẫn. Nghị định 102/2011/NĐ-CP là nghị định quy định chi tiết nội dung này, nhưng nó ban hành để hướng dẫn Luật Khám bệnh chữa bệnh 2009 vốn đã hết hiệu lực từ 01/01/2024. Tra cứu ngày 09/09/2026 không tìm được văn bản nào bãi bỏ nó, cũng không tìm được nghị định mới thay thế. Nguyên nhân là cơ sở dữ liệu quốc gia vbpl.vn chặn truy cập tự động nên không đọc được trường tình trạng hiệu lực chính thức. Căn cứ chắc chắn để dùng là Điều 103 Luật Khám bệnh chữa bệnh 2023; muốn chốt phần chi tiết thì hỏi Vụ Pháp chế Bộ Y tế hoặc đơn vị tư vấn bảo hiểm.",
 src:{label:"Điều 103 Luật Khám bệnh, chữa bệnh 2023",url:"https://hethongphapluat.com/luat-kham-benh-chua-benh-2023/dieu-103"},
 q:"Điều 103 Luật Khám bệnh chữa bệnh 2023 bảo hiểm trách nhiệm nghề nghiệp nghị định hướng dẫn"},

/* ---- AN NINH TRẬT TỰ ---- */
{id:"antt96",cat:"antt",tier:1,flag:"new",
 title:"Giấy chứng nhận đủ điều kiện về an ninh, trật tự",
 code:"96/2016/NĐ-CP · sửa bởi 56/2023 và 58/2026/NĐ-CP", eff:"Bản sửa đổi mới nhất hiệu lực 15/3/2026, một số quy định từ 01/7/2026",
 essence:"Kinh doanh dịch vụ phẫu thuật thẩm mỹ nằm trong danh mục ngành nghề phải có Giấy chứng nhận đủ điều kiện về an ninh, trật tự do cơ quan công an cấp. Đây là giấy phép độc lập với giấy phép hoạt động khám chữa bệnh do Sở Y tế cấp — có cái này không có nghĩa là có cái kia.",
 duties:["Kiểm tra ngay bệnh viện đã có Giấy chứng nhận đủ điều kiện về an ninh, trật tự chưa và giấy còn hiệu lực không. Đây là loại giấy phép hay bị bỏ sót nhất vì nhiều cơ sở tưởng giấy phép hoạt động của Sở Y tế là đủ.",
   "Nghị định 58/2026 đã mở rộng định nghĩa ngành nghề này. Không còn giới hạn ở phẫu thuật mà bao gồm cả dịch vụ dùng thuốc, các chất hoặc thiết bị can thiệp vào cơ thể người để thay đổi màu sắc da, hình dạng cơ thể, khắc phục khiếm khuyết, và cả xăm, phun, thêu trên da.",
   "Rà lại toàn bộ dịch vụ đang bán, kể cả bộ phận phun xăm và chăm sóc da, để xác định phạm vi nào rơi vào diện phải có giấy này theo định nghĩa mới.",
   "Người chịu trách nhiệm về an ninh trật tự của cơ sở phải đáp ứng điều kiện nhân thân theo nghị định.",
   "Từ Nghị định 58/2026, hồ sơ xin cấp giấy cho ngành nghề này được miễn nộp tài liệu chứng minh điều kiện phòng cháy chữa cháy."],
 risks:["Hoạt động khi chưa có Giấy chứng nhận đủ điều kiện về an ninh, trật tự là kinh doanh ngành nghề có điều kiện mà không đủ điều kiện, chế tài có thể tới đình chỉ hoạt động.",
   "Định nghĩa vừa mở rộng từ 15/3/2026 nên cơ sở đang dựa vào tư vấn pháp lý cũ hoàn toàn có thể tin rằng mình không thuộc diện phải xin, trong khi thực tế đã thuộc.",
   "Đây là đầu mối kiểm tra của cơ quan công an, độc lập với các đợt kiểm tra của ngành y tế, nên không thể trông chờ hai bên bù trừ cho nhau."],
 notes:"Đã kiểm chứng ngày 09/09/2026. Trước Nghị định 58/2026, định nghĩa tại khoản 20 Điều 3 Nghị định 96/2016 chỉ nói tới việc dùng kỹ thuật y học để phẫu thuật làm thay đổi hình dáng, đặc điểm nhận dạng con người. Bản mở rộng nhắm vào tình trạng cơ sở thẩm mỹ biến tướng hoạt động không phép. Đây là mục nên kiểm tra sớm nhất trong cả bảng vì bệnh viện có thể đang thiếu một giấy phép mà không biết.",
 src:{label:"Nghị định 58/2026/NĐ-CP",url:"https://thuvienphapluat.vn/van-ban/Thuong-mai/Nghi-dinh-58-2026-ND-CP-sua-doi-nghi-dinh-dieu-kien-an-ninh-nghe-dau-tu-kinh-doanh-co-dieu-kien-695172.aspx"},
 q:"Nghị định 58/2026/NĐ-CP an ninh trật tự dịch vụ phẫu thuật thẩm mỹ giấy chứng nhận"},

/* ---- DOANH NGHIỆP ---- */
{id:"luatdn",cat:"dn",tier:2,flag:"new",
 title:"Luật Doanh nghiệp, sửa đổi bổ sung năm 2025",
 code:"59/2020/QH14 · sửa bởi 76/2025/QH15", eff:"Bản sửa đổi hiệu lực 01/7/2025",
 essence:"Khung quản trị công ty. Điểm mới lớn nhất năm 2025 là nghĩa vụ về chủ sở hữu hưởng lợi — nhà nước muốn nhìn xuyên qua các lớp sở hữu để biết ai thực sự đứng sau doanh nghiệp.",
 duties:["Thu thập, cập nhật và lưu giữ thông tin chủ sở hữu hưởng lợi, cung cấp cho cơ quan nhà nước khi được yêu cầu.",
   "Doanh nghiệp thành lập trước 01/7/2025 bổ sung thông tin này đồng thời tại lần thông báo thay đổi đăng ký doanh nghiệp gần nhất.",
   "Nắm rõ ranh giới thẩm quyền của mình: việc nào thuộc quyền giám đốc, việc nào phải trình hội đồng quản trị, việc nào phải do người đại diện theo pháp luật ký."],
 risks:["Ký vượt thẩm quyền là rủi ro cá nhân của người điều hành, hậu quả có thể là trách nhiệm bồi thường cá nhân.",
   "Hồ sơ chủ sở hữu hưởng lợi không đầy đủ gây tắc mọi thủ tục đăng ký thay đổi về sau."],
 notes:"Với vị trí giám đốc điều hành, việc đáng làm nhất ở luật này là đọc lại điều lệ công ty và quy chế phân cấp thẩm quyền — biết chính xác mình được ký cái gì.",
 src:{label:"Cổng đăng ký doanh nghiệp quốc gia",url:"https://dangkykinhdoanh.gov.vn/vn/Pages/ChiTietVanBan.aspx?vID=27042"},
 q:"Luật số 76/2025/QH15 sửa đổi Luật Doanh nghiệp chủ sở hữu hưởng lợi"},

{id:"luatdt",cat:"dn",tier:3,
 title:"Luật Đầu tư — ngành nghề kinh doanh có điều kiện",
 code:"61/2020/QH14", eff:"Hiệu lực 01/01/2021, đã qua nhiều lần sửa đổi",
 essence:"Dịch vụ khám bệnh, chữa bệnh nằm trong danh mục ngành nghề kinh doanh có điều kiện. Điều kiện phải được duy trì suốt vòng đời hoạt động, không chỉ lúc xin phép.",
 duties:["Rà soát định kỳ xem các điều kiện đã dùng để được cấp phép còn được duy trì hay không: nhân sự chịu trách nhiệm chuyên môn, cơ sở vật chất, thiết bị, thuốc cấp cứu.",
   "Khi người chịu trách nhiệm chuyên môn kỹ thuật nghỉ việc, phải có phương án thay thế trước khi người đó rời đi."],
 risks:["Mất người chịu trách nhiệm chuyên môn mà chưa có người thay khiến giấy phép hoạt động bị treo trên thực tế."],
 notes:"", src:{label:"Cổng văn bản Chính phủ",url:"https://vanban.chinhphu.vn/"},
 q:"danh mục ngành nghề đầu tư kinh doanh có điều kiện dịch vụ khám bệnh chữa bệnh"},

/* ---- PCCC ---- */
{id:"nd105",cat:"pccc",tier:1,flag:"new",
 title:"Quy định chi tiết thi hành Luật Phòng cháy chữa cháy và cứu nạn cứu hộ",
 code:"105/2025/NĐ-CP", eff:"Ban hành 15/5/2025 · hiệu lực 01/7/2025",
 essence:"Thay thế Nghị định 136/2020, 83/2017 và 50/2024. Đây là nơi chứa nghĩa vụ hằng tháng dễ quên nhất của cả bệnh viện.",
 duties:["Mọi cơ sở phải tự kiểm tra phòng cháy chữa cháy định kỳ mỗi tháng một lần và lưu biên bản.",
   "Cơ quan chức năng kiểm tra theo chu kỳ 1 đến 3 năm một lần tùy loại cơ sở, cộng kiểm tra đột xuất khi có dấu hiệu vi phạm hoặc đơn tố cáo.",
   "Danh mục cơ sở thuộc diện quản lý về phòng cháy tại Phụ lục I mở rộng lên 34 loại — đối chiếu lại xem bệnh viện và hạng mục phụ trợ rơi vào đâu.",
   "Kiểm tra nghĩa vụ mua bảo hiểm cháy nổ bắt buộc theo danh mục tại nghị định.",
   "Rà lại nội quy phòng cháy chữa cháy theo đúng các nội dung bắt buộc mà nghị định quy định."],
 risks:["Không có biên bản tự kiểm tra hằng tháng là lỗi bị bắt ngay khi đoàn kiểm tra vào, vì nó thuần túy là giấy tờ.",
   "Thiếu bảo hiểm cháy nổ bắt buộc vừa bị phạt vừa mất khả năng bù đắp khi sự cố thật xảy ra."],
 notes:"Kỳ hạn thực tập phương án chữa cháy do nghị định này quy định — đọc đúng điều khoản thay vì áp theo thói quen cũ từ Nghị định 136/2020.",
 src:{label:"Cổng văn bản Chính phủ",url:"https://vanban.chinhphu.vn/?pageid=27160&docid=213702"},
 q:"Nghị định 105/2025/NĐ-CP tự kiểm tra phòng cháy chữa cháy hằng tháng"},

{id:"luatpccc",cat:"pccc",tier:1,flag:"new",
 title:"Luật Phòng cháy, chữa cháy và cứu nạn, cứu hộ",
 code:"55/2024/QH15", eff:"Hiệu lực 01/7/2025",
 essence:"Luật mới thay hoàn toàn Luật Phòng cháy và chữa cháy 2001. Với bệnh viện, trách nhiệm rơi thẳng vào người đứng đầu cơ sở chứ không phân tán.",
 duties:["Xác định bệnh viện thuộc nhóm cơ sở nào trong danh mục cơ sở thuộc diện quản lý về phòng cháy — nhóm quyết định toàn bộ nghĩa vụ phía sau.",
   "Người đứng đầu cơ sở chịu trách nhiệm trực tiếp về điều kiện an toàn phòng cháy, không ủy quyền hết cho phòng hành chính được."],
 risks:["Cháy tại cơ sở y tế có người lưu trú qua đêm là kịch bản dẫn tới trách nhiệm hình sự của người đứng đầu.",
   "Bệnh viện thẩm mỹ có rủi ro riêng: cồn, hóa chất, oxy y tế, và bệnh nhân đang gây mê không tự thoát được."],
 notes:"", src:{label:"Cổng văn bản Chính phủ",url:"https://vanban.chinhphu.vn/"},
 q:"Luật Phòng cháy chữa cháy và cứu nạn cứu hộ 2024 số 55/2024/QH15"},

{id:"nd106",cat:"pccc",tier:2,flag:"new",
 title:"Xử phạt vi phạm hành chính về phòng cháy, chữa cháy và cứu nạn, cứu hộ",
 code:"106/2025/NĐ-CP", eff:"Cùng khung với Nghị định 105/2025",
 essence:"Bảng giá cho sai phạm phòng cháy chữa cháy, đi kèm Nghị định 105/2025 tạo thành khung pháp lý hiện hành.",
 duties:["Đưa mức phạt vào báo cáo rủi ro hằng quý gửi hội đồng quản trị, để đầu tư thiết bị phòng cháy được nhìn như giảm rủi ro chứ không phải chi phí."],
 risks:["Đình chỉ hoạt động vì lý do phòng cháy dừng doanh thu ngay lập tức, không có thời gian khắc phục dần."],
 notes:"", src:{label:"Cổng văn bản Chính phủ",url:"https://vanban.chinhphu.vn/"},
 q:"Nghị định 106/2025/NĐ-CP xử phạt vi phạm hành chính phòng cháy chữa cháy"},

/* ---- THIẾT BỊ & MỸ PHẨM ---- */
{id:"nd98",cat:"tb",tier:2,
 title:"Quản lý thiết bị y tế",
 code:"98/2021/NĐ-CP · sửa bởi 07/2023 và 04/2025", eff:"Hợp nhất tại 08/VBHN-BYT năm 2026",
 fine:"300 triệu đồng", fineNote:"mức phạt tối đa với tổ chức trong lĩnh vực thiết bị y tế theo Nghị định 90/2026",
 essence:"Mọi máy can thiệp trong bệnh viện thẩm mỹ — laser, RF, HIFU, máy hút mỡ — là thiết bị y tế và phải có số lưu hành hợp lệ. Rủi ro âm thầm vì máy thường do nhà cung cấp mang tới.",
 duties:["Lập sổ theo dõi toàn bộ thiết bị: tên, chủng loại, số lưu hành, nhà cung cấp, ngày đưa vào sử dụng, lịch bảo trì và hiệu chuẩn.",
   "Trước khi nhận máy mới, yêu cầu nhà cung cấp xuất trình đầy đủ hồ sơ pháp lý của thiết bị và lưu bản sao.",
   "Theo dõi Thông tư 24/2026/TT-BYT về biện pháp quản lý sản phẩm hàng hóa là thiết bị y tế, hiệu lực 01/7/2026."],
 risks:["Sử dụng thiết bị không có số lưu hành hoặc không rõ nguồn gốc nằm trong nhóm bị phạt cao nhất, tới 300 triệu với tổ chức.",
   "Máy xách tay hoặc máy mượn dùng thử của nhà phân phối là bẫy phổ biến nhất."],
 notes:"", src:{label:"Cục Cơ sở hạ tầng và Thiết bị y tế",url:"https://imda.moh.gov.vn/van-ban-phap-quy"},
 q:"Nghị định 98/2021/NĐ-CP quản lý thiết bị y tế văn bản hợp nhất mới nhất"},

{id:"mypham",cat:"tb",tier:2,
 title:"Quản lý mỹ phẩm và ghi nhãn hàng hóa",
 code:"TT 06/2011/TT-BYT · sửa bởi TT 34/2025/TT-BYT", eff:"Bản sửa đổi hiệu lực 18/8/2025 · Nghị định 37/2026/NĐ-CP về nhãn hàng hóa hiệu lực 23/01/2026",
 essence:"Mỹ phẩm bán hoặc dùng trong bệnh viện phải có phiếu công bố sản phẩm mỹ phẩm hợp lệ. Cơ sở pháp lý hiện hành vẫn ở cấp thông tư, chưa lên cấp nghị định.",
 duties:["Rà soát toàn bộ mỹ phẩm đang dùng và đang bán: phiếu công bố còn hiệu lực không, nhãn đúng quy định không.",
   "Áp dụng Thông tư 06/2011/TT-BYT bản đã sửa bởi Thông tư 34/2025/TT-BYT (hiệu lực 18/8/2025) làm căn cứ công bố mỹ phẩm — đây là văn bản đang có hiệu lực thật, không phải bản dự thảo.",
   "Kiểm tra nhãn theo Nghị định 37/2026/NĐ-CP về nhãn hàng hóa, đã hiệu lực từ 23/01/2026.",
   "Theo dõi Nghị định quản lý mỹ phẩm mới (nâng cấp toàn bộ khung quản lý mỹ phẩm từ thông tư lên nghị định) do Bộ Y tế soạn thảo — bản dự thảo gần nhất công bố lấy ý kiến ngày 29/5/2026, chưa có số hiệu chính thức."],
 risks:["Mỹ phẩm không rõ nguồn gốc hoặc chưa công bố nằm trong nhóm bị xử phạt nặng theo Nghị định 90/2026."],
 notes:"Đã kiểm chứng ngày 07/09/2026: Nghị định quản lý mỹ phẩm vẫn đang ở dạng dự thảo lấy ý kiến, chưa được ký ban hành, chưa có số hiệu. Trong lúc chờ, cơ sở pháp lý đang áp dụng vẫn là Thông tư 06/2011/TT-BYT (đã sửa bởi Thông tư 34/2025/TT-BYT). Khi nghị định mới được ký, đây sẽ là thay đổi lớn cho cả ngành — cần kiểm tra lại mỗi lần bấm Cập nhật ngay.",
 src:{label:"Toàn văn dự thảo trên Cổng Xây dựng chính sách",url:"https://xaydungchinhsach.chinhphu.vn/toan-van-du-thao-nghi-dinh-quy-dinh-ve-quan-ly-my-pham-119260529154617902.htm"},
 q:"nghị định quản lý mỹ phẩm mới nhất phiếu công bố sản phẩm mỹ phẩm 2026"},

/* ---- DƯỢC & THUỐC ---- */
{id:"luatduoc",cat:"duoc",tier:2,
 title:"Luật Dược",
 code:"105/2016/QH13 · sửa bởi 44/2024/QH15", eff:"Bản sửa đổi hiệu lực 01/7/2025 · hợp nhất tại 76/VBHN-VPQH năm 2026",
 fine:"300 triệu đồng", fineNote:"mức phạt tối đa với tổ chức trong lĩnh vực dược theo Nghị định 90/2026",
 essence:"Bệnh viện thẩm mỹ dùng thuốc mỗi ngày: thuốc tê, thuốc mê, an thần, kháng sinh, botulinum toxin. Luật Dược chi phối toàn bộ nguồn gốc, bảo quản và sử dụng số thuốc đó. Đây là nhóm rủi ro thường bị bỏ quên vì cơ sở nghĩ mình không kinh doanh dược.",
 duties:["Xác nhận bộ phận dược của bệnh viện có người chịu trách nhiệm chuyên môn về dược đủ điều kiện theo quy định.",
   "Chỉ mua thuốc từ cơ sở đủ điều kiện kinh doanh dược, lưu hóa đơn và chứng từ chứng minh nguồn gốc từng lô.",
   "Mọi thuốc sử dụng cho người bệnh phải có giấy đăng ký lưu hành hợp lệ tại Việt Nam — đặc biệt với botulinum toxin và các thuốc tiêm dùng trong thẩm mỹ.",
   "Kiểm soát hạn dùng và điều kiện bảo quản theo đúng khuyến cáo của nhà sản xuất, có nhật ký theo dõi nhiệt độ nơi bảo quản."],
 risks:["Sử dụng thuốc không rõ nguồn gốc hoặc chưa được cấp phép lưu hành là vi phạm nặng, có thể bị đình chỉ hoạt động và truy cứu trách nhiệm hình sự nếu xảy ra tai biến.",
   "Thuốc xách tay, hàng biếu tặng hoặc hàng do người giới thiệu sản phẩm để lại là con đường phổ biến nhất đưa thuốc không hợp pháp vào cơ sở thẩm mỹ."],
 notes:"Nên đọc bản hợp nhất 76/VBHN-VPQH thay vì bản Luật Dược 2016 gốc, vì bản gốc chưa có nội dung sửa đổi năm 2024.",
 src:{label:"Cổng văn bản Chính phủ",url:"https://vanban.chinhphu.vn/?pageid=27160&docid=212466&classid=1&typegroupid=3"},
 q:"Văn bản hợp nhất 76/VBHN-VPQH Luật Dược toàn văn"},

{id:"nd163",cat:"duoc",tier:2,flag:"new",
 title:"Quy định chi tiết thi hành Luật Dược",
 code:"163/2025/NĐ-CP", eff:"Ban hành 29/6/2025 · hiệu lực 01/7/2025",
 essence:"Nghị định hướng dẫn thi hành Luật Dược sau lần sửa đổi 2024. Đây là nơi quy định chi tiết điều kiện đối với bộ phận dược trong cơ sở khám bệnh, chữa bệnh, cùng bộ thủ tục hành chính đi kèm.",
 duties:["Rà soát điều kiện của bộ phận dược trong bệnh viện: nhân sự chịu trách nhiệm chuyên môn, cơ sở vật chất, tài liệu kỹ thuật.",
   "Đối chiếu danh mục thủ tục hành chính mới và thủ tục bị bãi bỏ được công bố tại Quyết định 2278/QĐ-BYT kèm theo nghị định này, trước khi nộp bất kỳ hồ sơ nào về dược.",
   "Cập nhật quy chế dược nội bộ theo khung mới thay vì giữ nguyên quy chế soạn theo Nghị định 54/2017."],
 risks:["Thiếu người chịu trách nhiệm chuyên môn về dược khiến toàn bộ hoạt động cấp phát và sử dụng thuốc nội bộ không có căn cứ pháp lý vững.",
   "Nộp hồ sơ theo thủ tục cũ đã bị bãi bỏ làm kéo dài thời gian xử lý, ảnh hưởng tới các mốc tuân thủ khác."],
 notes:"",
 src:{label:"Cổng văn bản Chính phủ",url:"https://vanban.chinhphu.vn/"},
 q:"Nghị định 163/2025/NĐ-CP quy định chi tiết thi hành Luật Dược toàn văn"},

{id:"tt26kd",cat:"duoc",tier:2,flag:"new",
 title:"Kê đơn thuốc và lộ trình đơn thuốc điện tử bắt buộc",
 code:"26/2025/TT-BYT", eff:"Ban hành 30/6/2025 · hiệu lực 01/7/2025",
 essence:"Thay thế bốn thông tư cũ về kê đơn, trong đó có Thông tư 52/2017. Điểm buộc phải hành động ngay là lộ trình đơn thuốc điện tử: bệnh viện áp dụng từ 01/10/2025, các cơ sở khám bệnh chữa bệnh khác từ 01/01/2026. Cả hai mốc đều đã qua.",
 duties:["Xác nhận phần mềm của bệnh viện đã kê đơn thuốc điện tử và liên thông dữ liệu đúng quy định. Đây là việc kiểm tra đầu tiên vì mốc bắt buộc đã qua từ lâu.",
   "Bảo đảm đơn thuốc có đủ thông tin bắt buộc: định danh người bệnh, tên thuốc, hàm lượng, số lượng, liều dùng, cách dùng và thời gian dùng.",
   "Rà lại thực tế ai đang ký đơn thuốc — chỉ người hành nghề đủ điều kiện theo quy định mới được kê đơn.",
   "Nắm giới hạn thời gian kê đơn với nhóm thuốc kiểm soát đặc biệt: thuốc gây nghiện tối đa 7 ngày cho bệnh cấp tính, thuốc hướng thần tối đa 10 ngày cho bệnh cấp tính và 30 ngày cho bệnh mạn tính."],
 risks:["Chưa chuyển sang đơn thuốc điện tử là vi phạm đã quá hạn tuân thủ, rất dễ bị phát hiện khi hậu kiểm bằng dữ liệu thay vì kiểm tra thực địa.",
   "Người không đủ điều kiện đứng tên kê đơn là lỗi nghiêm trọng, kéo theo trách nhiệm liên đới của cơ sở khi có tai biến."],
 notes:"Trong nhóm Dược, đây là mục nên kiểm tra trước tiên vì thời hạn tuân thủ đã trôi qua và bằng chứng vi phạm nằm sẵn trong dữ liệu hệ thống.",
 src:{label:"Toàn văn trên Cổng thông tin Chính phủ",url:"https://datafiles.chinhphu.vn/cpp/files/vbpq/2025/7/26-byt.pdf"},
 q:"Thông tư 26/2025/TT-BYT kê đơn thuốc đơn thuốc điện tử lộ trình bắt buộc"},

{id:"tt18ksdb",cat:"duoc",tier:1,flag:"new",
 title:"Thuốc và nguyên liệu làm thuốc phải kiểm soát đặc biệt",
 code:"18/2026/TT-BYT", eff:"Ban hành 01/6/2026 · hiệu lực 16/7/2026",
 essence:"Thay thế Thông tư 20/2017. Quy định cách quản lý thuốc gây nghiện, thuốc hướng thần và tiền chất dùng làm thuốc. Với bệnh viện thẩm mỹ, đây chính là nhóm thuốc dùng khi gây mê, an thần và giảm đau — quản lý sai không dừng ở phạt tiền mà chuyển thẳng sang rủi ro hình sự.",
 duties:["Rà danh mục thuốc đang sử dụng đối chiếu danh mục mới. Etomidate và Carisoprodol đã được bổ sung vào danh mục dược chất hướng thần từ 01/6/2026 — riêng Etomidate là thuốc dùng khởi mê nên nhiều cơ sở thẩm mỹ có sẵn.",
   "Bảo quản thuốc kiểm soát đặc biệt trong tủ riêng có khóa, giao cho người phụ trách bằng văn bản, có sổ theo dõi xuất nhập tồn tới từng ống thuốc.",
   "Hủy thuốc phải lập hội đồng và biên bản theo đúng quy trình, tuyệt đối không tự hủy rồi ghi sổ sau.",
   "Thông tư cho phép dùng hồ sơ điện tử thay sổ giấy, nhưng chỉ khi đáp ứng đủ điều kiện về toàn vẹn dữ liệu, khả năng truy xuất, bảo mật và xác thực. Chuyển đổi nửa vời vừa mất sổ giấy vừa không đạt điều kiện là tình huống xấu nhất."],
 risks:["Thất thoát thuốc gây nghiện hoặc hướng thần là vụ việc hình sự, người phụ trách và người đứng đầu cơ sở cùng chịu trách nhiệm.",
   "Sổ sách không khớp số lượng thực tế là lỗi bị phát hiện ngay trong mọi đợt kiểm tra, và rất khó giải thích khi chênh lệch nằm ở nhóm thuốc này.",
   "Dùng thuốc gây mê, an thần khi chưa được phê duyệt phạm vi chuyên môn tương ứng làm rủi ro nhân đôi: vừa vi phạm về dược, vừa vi phạm về khám chữa bệnh."],
 notes:"Đây là mục có hậu quả nặng nhất trong nhóm Dược. Nếu bệnh viện có thực hiện gây mê hoặc tiền mê, cần kiểm tra ngay danh mục thuốc và sổ theo dõi trước khi thông tư áp dụng ổn định.",
 src:{label:"Cổng văn bản Chính phủ",url:"https://vanban.chinhphu.vn/"},
 q:"Thông tư 18/2026/TT-BYT thuốc phải kiểm soát đặc biệt toàn văn"},

/* ---- MÔI TRƯỜNG ---- */
{id:"luatbvmt",cat:"mt",tier:2,
 title:"Luật Bảo vệ môi trường",
 code:"72/2020/QH14", eff:"Hiệu lực 01/01/2022",
 essence:"Bệnh viện là đối tượng phải có giấy phép môi trường. Nước thải y tế và chất thải lây nhiễm là hai thứ cơ quan chức năng kiểm tra kỹ nhất.",
 duties:["Có giấy phép môi trường còn hiệu lực và vận hành đúng nội dung đã cam kết trong giấy phép.",
   "Hệ thống xử lý nước thải y tế phải đạt quy chuẩn kỹ thuật hiện hành — cần xác nhận quy chuẩn nào đang áp dụng, vì bộ quy chuẩn nước thải vừa được cập nhật.",
   "Quan trắc nước thải định kỳ theo tần suất ghi trong giấy phép và lưu kết quả.",
   "Lập báo cáo công tác bảo vệ môi trường hằng năm."],
 risks:["Xả nước thải vượt quy chuẩn có mức phạt rất cao và có thể kèm đình chỉ.",
   "Giấy phép môi trường hết hạn mà chưa gia hạn là lỗi giấy tờ nhưng hậu quả tương đương lỗi kỹ thuật."],
 notes:"Bộ quy chuẩn kỹ thuật về nước thải đang trong giai đoạn chuyển đổi. Xác nhận với đơn vị tư vấn môi trường thay vì mặc định quy chuẩn cũ.",
 src:{label:"Cổng văn bản Chính phủ",url:"https://vanban.chinhphu.vn/"},
 q:"giấy phép môi trường bệnh viện thẩm mỹ quy chuẩn nước thải y tế hiện hành"},

{id:"nd08mt",cat:"mt",tier:2,flag:"new",
 title:"Nghị định hướng dẫn Luật Bảo vệ môi trường — giấy phép môi trường",
 code:"08/2022/NĐ-CP · sửa bởi 05/2025 và 48/2026/NĐ-CP", eff:"Nghị định gốc hiệu lực 10/01/2022 · bản sửa mới nhất hiệu lực cuối tháng 01/2026",
 essence:"Luật Bảo vệ môi trường chỉ đặt nguyên tắc, còn thủ tục và điều kiện cụ thể của giấy phép môi trường nằm ở nghị định này. Bảng trước đây chỉ có Luật mà thiếu nghị định, tức là thiếu đúng phần bệnh viện phải làm.",
 duties:["Xác định bệnh viện thuộc nhóm nào theo tiêu chí phân loại dự án và cơ sở trong nghị định, vì nhóm quyết định thẩm quyền cấp phép và nội dung giấy phép.",
   "Kiểm tra giấy phép môi trường còn hiệu lực đến ngày nào và nội dung vận hành thực tế có đúng cam kết trong giấy phép không.",
   "Nghị định 48/2026 đã chuyển thủ tục cấp, điều chỉnh, cấp lại và thu hồi giấy phép môi trường sang dịch vụ công trực tuyến toàn trình. Cập nhật lại quy trình nộp hồ sơ thay vì làm theo cách cũ.",
   "Thực hiện quan trắc theo đúng tần suất ghi trong giấy phép và lập báo cáo công tác bảo vệ môi trường hằng năm."],
 risks:["Vận hành lệch nội dung giấy phép bị xử lý như không có giấy phép trong nhiều trường hợp.",
   "Giấy phép hết hạn mà chưa gia hạn là lỗi giấy tờ nhưng hậu quả tương đương lỗi kỹ thuật, có thể kèm đình chỉ."],
 notes:"Đã kiểm chứng ngày 09/09/2026: Nghị định 08/2022 vẫn là văn bản gốc, chưa bị thay thế, đã qua hai lần sửa đổi bởi Nghị định 05/2025 và Nghị định 48/2026. Có chênh lệch nguồn về ngày ban hành Nghị định 48/2026, ghi 29 hoặc 30 tháng 01 năm 2026, cần đối chiếu Công báo nếu phải trích dẫn chính xác ngày.",
 src:{label:"Nghị định 08/2022/NĐ-CP trên Cổng văn bản Chính phủ",url:"https://vanban.chinhphu.vn/?pageid=27160&docid=212284"},
 q:"Nghị định 48/2026/NĐ-CP sửa đổi Nghị định 08/2022 giấy phép môi trường"},

{id:"qcvn40",cat:"mt",tier:2,flag:"new",
 title:"Quy chuẩn nước thải — quy chuẩn y tế cũ đã bị bãi bỏ",
 code:"QCVN 40:2025/BTNMT · ban hành kèm Thông tư 06/2025/TT-BTNMT", eff:"Thông tư ban hành 28/02/2025 · quy chuẩn áp dụng từ 01/9/2025",
 essence:"QCVN 28:2010/BTNMT về nước thải y tế, quy chuẩn mà hầu hết bệnh viện vẫn đang vận hành theo, đã bị bãi bỏ. Đây là thay đổi âm thầm nhưng chạm thẳng vào hệ thống xử lý nước thải và kết quả quan trắc định kỳ.",
 duties:["Xác định bệnh viện đang áp dụng quy chuẩn nào trong giấy phép môi trường hiện có, vì đó là căn cứ để biết mình thuộc diện chuyển tiếp hay phải áp dụng ngay.",
   "Cơ sở đã có báo cáo đánh giá tác động môi trường hoặc giấy phép môi trường trước ngày 01/9/2025 được tiếp tục áp dụng quy chuẩn cũ đến hết ngày 31/12/2031. Đây là khoảng thở, không phải miễn trừ vĩnh viễn.",
   "Cơ sở cấp phép sau mốc trên phải áp dụng quy chuẩn mới ngay từ đầu.",
   "Làm việc với đơn vị tư vấn môi trường để xác định chính xác cột và hệ số áp dụng cho nước thải bệnh viện theo quy chuẩn mới, rồi đối chiếu với năng lực thực tế của hệ thống xử lý đang có.",
   "Theo dõi thêm QCVN 98:2025/BNNMT về công trình và thiết bị xử lý nước thải tại chỗ, áp dụng từ 26/02/2026."],
 risks:["Quan trắc theo quy chuẩn đã bị bãi bỏ khiến kết quả không có giá trị đối chiếu khi bị kiểm tra.",
   "Hệ thống xử lý thiết kế theo ngưỡng cũ có thể không đạt ngưỡng mới, và đây là loại đầu tư không thể xoay trong vài tuần nên phải biết sớm.",
   "Xả nước thải vượt quy chuẩn là nhóm vi phạm có mức phạt rất cao và có thể kèm đình chỉ."],
 notes:"Đã kiểm chứng ngày 09/09/2026 qua ba nguồn độc lập về việc QCVN 28:2010 bị bãi bỏ. Còn một điểm chưa chốt được: QCVN 40:2025 tự mô tả phạm vi là nước thải công nghiệp và loại trừ nước thải sinh hoạt đô thị, nên việc bệnh viện áp dụng cột và hệ số nào cụ thể cần đọc trực tiếp mục phạm vi và phụ lục của bản gốc. Đây là câu hỏi đầu tiên nên đặt cho đơn vị tư vấn môi trường.",
 src:{label:"Thông tư 06/2025/TT-BTNMT trên Công báo",url:"https://congbao.chinhphu.vn/tai-ve-van-ban-so-06-2025-tt-btnmt-44497-55552"},
 q:"QCVN 40:2025/BTNMT nước thải bệnh viện thay QCVN 28:2010 chuyển tiếp"},

{id:"tt20",cat:"mt",tier:2,
 title:"Quản lý chất thải y tế trong khuôn viên cơ sở y tế",
 code:"20/2021/TT-BYT", eff:"Bộ Y tế ban hành năm 2021",
 essence:"Quy định cách phân loại, thu gom, lưu giữ và chuyển giao chất thải y tế ngay bên trong cơ sở. Đây là chỗ mà sai sót nhỏ của một điều dưỡng trở thành vi phạm của cả bệnh viện.",
 duties:["Phân loại đúng tại nguồn: chất thải lây nhiễm, chất thải nguy hại không lây nhiễm, chất thải thông thường.",
   "Lưu chứng từ chuyển giao chất thải nguy hại cho từng lần thu gom, có chữ ký xác nhận của đơn vị thu gom.",
   "Lập báo cáo quản lý chất thải y tế theo mẫu tại Phụ lục 07 của thông tư.",
   "Tập huấn định kỳ cho nhân viên về phân loại chất thải và lưu hồ sơ tập huấn."],
 risks:["Bệnh viện thẩm mỹ phát sinh nhiều vật sắc nhọn và bông băng nhiễm khuẩn — khối lượng thực tế thường vượt xa con số đã khai trong hồ sơ môi trường."],
 notes:"", src:{label:"Cổng văn bản Chính phủ",url:"https://vanban.chinhphu.vn/"},
 q:"Thông tư 20/2021/TT-BYT quản lý chất thải y tế còn hiệu lực"},

{id:"atvsld",cat:"ld",tier:2,
 title:"Luật An toàn, vệ sinh lao động",
 code:"84/2015/QH13", eff:"Hiệu lực 01/7/2016",
 essence:"Nhân viên y tế thuộc nhóm có yếu tố nguy hiểm nghề nghiệp: phơi nhiễm máu và dịch, hóa chất, tia laser. Luật buộc cơ sở quản lý rủi ro đó một cách có hồ sơ.",
 duties:["Khám sức khỏe định kỳ và khám phát hiện bệnh nghề nghiệp cho nhóm có yếu tố nguy hiểm.",
   "Huấn luyện an toàn vệ sinh lao động theo nhóm đối tượng, lưu hồ sơ huấn luyện.",
   "Quan trắc môi trường lao động định kỳ.",
   "Có quy trình xử lý phơi nhiễm nghề nghiệp, đặc biệt với kim tiêm và dịch cơ thể."],
 risks:["Không có hồ sơ khám sức khỏe và huấn luyện là lỗi phổ biến và dễ bị bắt vì hoàn toàn nằm ở giấy tờ."],
 notes:"", src:{label:"Cổng văn bản Chính phủ",url:"https://vanban.chinhphu.vn/"},
 q:"Luật An toàn vệ sinh lao động 2015 khám sức khỏe định kỳ huấn luyện an toàn"},

{id:"bhxh",cat:"ld",tier:3,flag:"new",
 title:"Luật Bảo hiểm xã hội",
 code:"41/2024/QH15", eff:"Hiệu lực 01/7/2025",
 essence:"Luật mới thay Luật Bảo hiểm xã hội 2014, mở rộng đối tượng tham gia bắt buộc và siết chế tài với hành vi chậm đóng, trốn đóng.",
 duties:["Rà lại danh sách nhân sự để xác định ai thuộc diện đóng bảo hiểm xã hội bắt buộc theo quy định mới — diện này đã rộng hơn trước.",
   "Không để phát sinh nợ đóng: chậm đóng và trốn đóng nay có chế tài riêng và nặng hơn."],
 risks:["Trốn đóng bảo hiểm xã hội ở mức độ nhất định có thể bị xử lý hình sự, không dừng ở phạt hành chính."],
 notes:"Cần kiểm tra các nghị định và thông tư hướng dẫn mới nhất, vì nhóm văn bản hướng dẫn được ban hành rải rác trong 2025 và 2026.",
 src:{label:"Cổng văn bản Chính phủ",url:"https://vanban.chinhphu.vn/"},
 q:"Luật Bảo hiểm xã hội 2024 số 41/2024/QH15 nghị định hướng dẫn"},

{id:"blld",cat:"ld",tier:3,
 title:"Bộ luật Lao động",
 code:"45/2019/QH14", eff:"Hiệu lực 01/01/2021",
 essence:"Nền tảng cho quan hệ với nhân sự. Hai điểm nóng riêng của bệnh viện thẩm mỹ: hợp đồng với bác sĩ kiêm nhiệm nhiều nơi, và điều khoản bảo mật với kỹ thuật viên.",
 duties:["Kiểm tra loại hợp đồng đang ký với từng nhóm nhân sự có đúng bản chất công việc không — gọi là cộng tác viên nhưng làm việc như người lao động toàn thời gian là rủi ro.",
   "Nội quy lao động, thang bảng lương, thỏa ước lao động tập thể phải còn hiệu lực và đã đăng ký đúng quy định.",
   "Xây quy trình xử lý kỷ luật đúng trình tự — sa thải sai trình tự gần như luôn thua khi ra tòa lao động."],
 risks:["Tranh chấp lao động với bác sĩ hoặc kỹ thuật viên có tiếng thường kéo theo rủi ro truyền thông lớn hơn rủi ro tiền."],
 notes:"", src:{label:"Cổng văn bản Chính phủ",url:"https://vanban.chinhphu.vn/"},
 q:"Bộ luật Lao động 2019 số 45/2019/QH14 văn bản hợp nhất mới nhất"},

{id:"luatdlcn",cat:"dl",tier:1,flag:"new",
 title:"Luật Bảo vệ dữ liệu cá nhân",
 code:"91/2025/QH15", eff:"Hiệu lực 01/01/2026",
 fine:"3 tỷ đồng", fineNote:"mức phạt tiền tối đa với tổ chức; riêng chuyển dữ liệu xuyên biên giới tối đa 5% doanh thu năm trước",
 essence:"Rủi ro mới và bị đánh giá thấp nhất của ngành thẩm mỹ. Bệnh viện thẩm mỹ nắm loại dữ liệu nhạy cảm nhất có thể tưởng tượng: dữ liệu sức khỏe cộng với ảnh trước và sau của khách hàng.",
 duties:["Xác lập cơ sở pháp lý cho từng luồng dữ liệu: đăng ký khách hàng, hồ sơ bệnh án, ảnh trước sau, video quảng cáo, camera an ninh, dữ liệu marketing.",
   "Sự đồng ý phải rõ ràng và có thể rút lại. Đặc biệt với ảnh trước sau dùng cho quảng cáo — đây là điểm gãy phổ biến nhất của ngành.",
   "Chỉ định nhân sự phụ trách bảo vệ dữ liệu cá nhân hoặc thuê dịch vụ bên ngoài.",
   "Lập hồ sơ đánh giá tác động xử lý dữ liệu cá nhân theo hướng dẫn tại Nghị định 356/2025.",
   "Xóa dữ liệu cá nhân của người lao động khi họ nghỉ việc."],
 risks:["Mức phạt tiền tối đa cho các hành vi vi phạm khác trong lĩnh vực bảo vệ dữ liệu cá nhân là 3 tỷ đồng với tổ chức.",
   "Vi phạm về chuyển dữ liệu cá nhân xuyên biên giới bị phạt tối đa 5% doanh thu của năm liền trước.",
   "Vi phạm nghiêm trọng có thể bị truy cứu trách nhiệm hình sự.",
   "Rủi ro thực tế cao nhất: nhân viên marketing đăng ảnh trước sau của khách lên mạng xã hội mà không có văn bản đồng ý còn hiệu lực."],
 notes:"Nếu chỉ làm được một việc trong quý này, nên chọn việc này: dựng lại mẫu đồng ý sử dụng hình ảnh và dữ liệu sức khỏe của khách hàng. Vừa là rủi ro tiền lớn nhất, vừa là thứ dễ khắc phục nhất.",
 src:{label:"Bộ Công an",url:"https://bocongan.gov.vn/chinh-sach-phap-luat/bai-viet/luat-bao-ve-du-lieu-ca-nhan-chinh-thuc-co-hieu-luc-thi-hanh-tu-ngay-01-01-2026-1767186124"},
 q:"Luật Bảo vệ dữ liệu cá nhân 2025 số 91/2025/QH15 mức phạt doanh nghiệp"},

{id:"nd356",cat:"dl",tier:2,flag:"new",
 title:"Quy định chi tiết thi hành Luật Bảo vệ dữ liệu cá nhân",
 code:"356/2025/NĐ-CP", eff:"Ban hành 31/12/2025 · hiệu lực 01/01/2026",
 essence:"Thay thế Nghị định 13/2023/NĐ-CP. Đây là nơi có mẫu biểu và quy trình thực tế: hồ sơ đánh giá tác động, thủ tục chuyển dữ liệu ra nước ngoài, cách tính mức phạt.",
 duties:["Lập và lưu hồ sơ đánh giá tác động xử lý dữ liệu cá nhân theo mẫu và quy trình của nghị định.",
   "Nếu dùng phần mềm quản lý khách hàng hoặc lưu trữ đám mây đặt máy chủ ở nước ngoài, phải xử lý đúng thủ tục chuyển dữ liệu xuyên biên giới."],
 risks:["Nhiều bệnh viện dùng công cụ marketing và CRM nước ngoài mà không nhận ra mình đang chuyển dữ liệu sức khỏe ra khỏi Việt Nam."],
 notes:"", src:{label:"Cổng văn bản Chính phủ",url:"https://vanban.chinhphu.vn/"},
 q:"Nghị định 356/2025/NĐ-CP hướng dẫn Luật Bảo vệ dữ liệu cá nhân"},

{id:"hinhsu",cat:"ktd",tier:1,
 title:"Bộ luật Hình sự — Điều 315 và các tội liên quan",
 code:"100/2015/QH13 · sửa đổi 2017 và các lần sau", eff:"Đang có hiệu lực",
 essence:"Ranh giới cuối cùng. Khi một ca thẩm mỹ có tai biến nặng hoặc tử vong, vụ việc không dừng ở phạt hành chính. Điều 315 quy định tội vi phạm quy định về khám bệnh, chữa bệnh.",
 duties:["Hiểu ba yếu tố khiến vụ việc chuyển từ hành chính sang hình sự: làm sai phạm vi được cấp phép, người thực hiện không đủ điều kiện hành nghề, hồ sơ bệnh án không trung thực.",
   "Bảo đảm hồ sơ bệnh án ghi chép đầy đủ và trung thực ngay tại thời điểm thực hiện — đây là bằng chứng bảo vệ tốt nhất khi có sự cố.",
   "Có quy trình xử lý sự cố y khoa: báo cáo nội bộ ngay, giữ nguyên hiện trường và hồ sơ, không sửa chữa bổ sung sau khi sự cố xảy ra."],
 risks:["Trách nhiệm hình sự có thể rơi vào cả người trực tiếp thực hiện và người quản lý, tùy mức độ lỗi trong tổ chức và giám sát.",
   "Song song với hình sự là trách nhiệm bồi thường dân sự và khủng hoảng truyền thông — ba mặt trận cùng lúc."],
 notes:"Nếu bệnh viện chưa có quy trình xử lý sự cố y khoa được viết ra và diễn tập, đó là lỗ hổng nghiêm trọng hơn bất kỳ giấy tờ nào khác.",
 src:{label:"Cổng văn bản Chính phủ",url:"https://vanban.chinhphu.vn/"},
 q:"Điều 315 Bộ luật Hình sự tội vi phạm quy định về khám bệnh chữa bệnh"},

{id:"tt08gd",cat:"ktd",tier:2,flag:"new",
 title:"Giám định tư pháp trong lĩnh vực y tế",
 code:"08/2026/TT-BYT", eff:"Ban hành 24/4/2026 · hiệu lực 01/5/2026",
 essence:"Khi một ca thẩm mỹ có tai biến và cơ quan điều tra vào cuộc, họ trưng cầu giám định tư pháp. Kết luận giám định là bằng chứng quyết định vụ việc dừng ở dân sự hay chuyển sang hình sự. Thông tư này quy định ai được làm giám định viên, quy trình và thời hạn giám định. Nó thay thế bốn thông tư cũ, trong đó có Thông tư 21/2025/TT-BYT và 03/2025/TT-BYT.",
 duties:["Biết rằng ba trong mười hai lĩnh vực giám định của thông tư này chạm thẳng vào bệnh viện thẩm mỹ: khám chữa bệnh, dược và mỹ phẩm, thiết bị y tế.",
   "Chuẩn bị trước bộ hồ sơ sẽ bị trưng cầu khi có sự cố: hồ sơ bệnh án đầy đủ, phiếu đồng ý của người bệnh, hồ sơ pháp lý thiết bị đã dùng, nguồn gốc thuốc và vật tư đã dùng.",
   "Giữ nguyên vật chứng khi có sự cố: vỏ thuốc, ống tiêm, lô vật tư, nhật ký máy. Đây chính là thứ giám định viên sẽ hỏi.",
   "Đưa nội dung này vào quy trình xử lý sự cố y khoa của bệnh viện, đừng để đến lúc bị trưng cầu mới đi tìm giấy tờ."],
 risks:["Hồ sơ bệnh án thiếu hoặc ghi sau khiến kết luận giám định bất lợi, đây là con đường ngắn nhất dẫn tới trách nhiệm hình sự theo Điều 315.",
   "Không chứng minh được nguồn gốc thuốc, chất làm đầy hoặc thiết bị đã dùng sẽ bị suy đoán bất lợi."],
 notes:"Thông tư này căn cứ Luật Giám định tư pháp 2025. Đây là văn bản do máy quét tự phát hiện và đã được đối chiếu, đưa vào bảng ngày 06/09/2026.",
 src:{label:"Cổng văn bản Chính phủ",url:"https://vanban.chinhphu.vn/?docid=217946&pageid=27160"},
 q:"Thông tư 08/2026/TT-BYT giám định tư pháp lĩnh vực y tế toàn văn"},

{id:"bvntd",cat:"ktd",tier:2,
 title:"Luật Bảo vệ quyền lợi người tiêu dùng",
 code:"19/2023/QH15", eff:"Hiệu lực 01/7/2024",
 essence:"Khách hàng thẩm mỹ là người tiêu dùng. Luật này chi phối hợp đồng dịch vụ, điều khoản mẫu, chính sách hoàn tiền và cách xử lý khiếu nại.",
 duties:["Hợp đồng dịch vụ và điều khoản mẫu phải minh bạch, không chứa điều khoản loại trừ trách nhiệm một cách bất công.",
   "Cung cấp thông tin đầy đủ, chính xác về dịch vụ, rủi ro và chi phí trước khi khách ký.",
   "Có quy trình tiếp nhận và giải quyết khiếu nại bằng văn bản, có thời hạn phản hồi rõ ràng."],
 risks:["Điều khoản mẫu bắt khách hàng từ bỏ quyền khiếu nại thường bị tuyên vô hiệu, và làm xấu vị thế khi tranh chấp."],
 notes:"Giấy cam kết trước phẫu thuật không phải lá chắn pháp lý như nhiều cơ sở tưởng. Nó chỉ có giá trị khi chứng minh được khách đã được giải thích đầy đủ và tự nguyện.",
 src:{label:"Cổng văn bản Chính phủ",url:"https://vanban.chinhphu.vn/"},
 q:"Luật Bảo vệ quyền lợi người tiêu dùng 2023 hợp đồng theo mẫu điều kiện giao dịch chung"},

/* ---- QUẢNG CÁO ---- */
{id:"nd342",cat:"qc",tier:2,flag:"new",
 title:"Quy định chi tiết Luật Quảng cáo — nội dung bắt buộc",
 code:"342/2025/NĐ-CP", eff:"Ban hành 26/12/2025 · hiệu lực 15/02/2026",
 essence:"Văn bản mà đội marketing phải dán lên tường. Nó liệt kê chính xác thông tin bắt buộc trong mỗi mẩu quảng cáo dịch vụ khám chữa bệnh và mỹ phẩm, và bãi bỏ hoàn toàn Nghị định 181/2013 và 70/2021.",
 duties:["Nội dung quảng cáo dịch vụ khám chữa bệnh bắt buộc phải có: tên, địa chỉ, số giấy phép hoạt động, thời gian hoạt động của cơ sở; và phạm vi hoạt động chuyên môn đã được cơ quan y tế phê duyệt.",
   "Rà lại toàn bộ tài sản quảng cáo hiện có: website, fanpage, TikTok, biển hiệu, tờ rơi, bài PR.",
   "Quảng cáo mỹ phẩm không được gây hiểu nhầm sản phẩm là thuốc chữa bệnh.",
   "Ban hành quy trình duyệt nội dung nội bộ: mọi bài đăng phải qua một người kiểm tra khối thông tin bắt buộc."],
 risks:["Thiếu số giấy phép hoạt động hoặc phạm vi chuyên môn trong bài quảng cáo là lỗi hình thức, rất dễ bị bắt và rất khó cãi.",
   "Quảng cáo vượt quá phạm vi chuyên môn được duyệt là bằng chứng tự khai về việc làm sai phạm vi."],
 notes:"Đây là văn bản có tỷ lệ lợi ích trên công sức cao nhất trong cả danh sách. Một buổi rà soát nội dung theo Điều 9 nghị định này loại bỏ phần lớn rủi ro marketing.",
 src:{label:"Cổng văn bản Chính phủ",url:"https://vanban.chinhphu.vn/"},
 q:"Nghị định 342/2025/NĐ-CP nội dung quảng cáo dịch vụ khám bệnh chữa bệnh Điều 9"},

{id:"luatqc",cat:"qc",tier:2,flag:"new",
 title:"Luật Quảng cáo, sửa đổi bổ sung năm 2025",
 code:"16/2012/QH13 · sửa bởi 75/2025/QH15", eff:"Bản sửa đổi hiệu lực 01/01/2026",
 essence:"Lần sửa đổi toàn diện đầu tiên kể từ 2012. Với bệnh viện thẩm mỹ, đây là văn bản chi phối toàn bộ marketing — thứ tạo ra doanh thu nhưng cũng tạo ra nhiều án phạt nhất của ngành.",
 duties:["Dịch vụ khám chữa bệnh thuộc nhóm dịch vụ đặc biệt: quảng cáo phải có giấy phép hành nghề hoặc giấy phép hoạt động khám chữa bệnh làm căn cứ.",
   "Quảng cáo mỹ phẩm phải có phiếu công bố sản phẩm mỹ phẩm.",
   "Nội dung phải trung thực, chính xác, rõ ràng, không gây hiểu nhầm về tính năng, chất lượng, công dụng.",
   "Luật bổ sung trách nhiệm của người chuyển tải sản phẩm quảng cáo — áp dụng cho KOL và cả nhân sự bệnh viện khi lên hình."],
 risks:["Thổi phồng công dụng, cam kết kết quả, dùng ảnh trước sau không đúng thực tế là nhóm vi phạm phổ biến nhất và bị xử lý công khai trên báo.",
   "Một nội dung sai có thể vừa bị xử phạt về quảng cáo, vừa bị xử phạt về khám chữa bệnh theo Nghị định 90/2026."],
 notes:"", src:{label:"Cổng văn bản Chính phủ",url:"https://vanban.chinhphu.vn/"},
 q:"Luật số 75/2025/QH15 sửa đổi bổ sung một số điều của Luật Quảng cáo"},

{id:"nd87",cat:"qc",tier:2,flag:"new",
 title:"Xử phạt vi phạm hành chính lĩnh vực văn hóa và quảng cáo",
 code:"87/2026/NĐ-CP", eff:"Ban hành 27/3/2026 · hiệu lực 15/5/2026",
 fine:"200 triệu đồng", fineNote:"mức phạt tối đa với tổ chức trong lĩnh vực quảng cáo; lĩnh vực văn hóa thấp hơn, tối đa 100 triệu đồng với tổ chức",
 essence:"Bảng giá cho sai phạm quảng cáo, thay thế hoàn toàn Nghị định 38/2021/NĐ-CP và các nghị định từng sửa nó (128/2022/NĐ-CP và phần quảng cáo của 129/2021/NĐ-CP). Song hành với Nghị định 90/2026 — một nội dung sai có thể bị soi từ cả hai phía.",
 duties:["Thay mọi căn cứ 38/2021/NĐ-CP trong tài liệu đào tạo và quy trình duyệt nội dung bằng 87/2026/NĐ-CP.",
   "Đưa mức phạt mới vào tài liệu đào tạo nhân sự marketing: quảng cáo tối đa 100 triệu cá nhân, 200 triệu tổ chức; văn hóa tối đa 50 triệu cá nhân, 100 triệu tổ chức.",
   "Đối chiếu lại các hành vi bị phạt bổ sung liên quan giấy phép hoạt động khám bệnh, chữa bệnh — nghị định có nhắc chế tài tước quyền sử dụng giấy phép, cần đọc kỹ điều khoản áp dụng cho quảng cáo dịch vụ y tế."],
 risks:["Phạt tiền cộng buộc tháo gỡ và cải chính công khai — thiệt hại thương hiệu thường lớn hơn tiền phạt.",
   "Dùng lại số liệu mức phạt cũ theo 38/2021 khi báo cáo hội đồng quản trị hoặc đào tạo nội bộ là căn cứ sai từ 15/5/2026."],
 notes:"Đã kiểm chứng ngày 07/09/2026: Nghị định 38/2021/NĐ-CP hết hiệu lực, thay bằng Nghị định 87/2026/NĐ-CP. Mới xác nhận được khung mức phạt tổng quát, chưa đối chiếu toàn văn chi tiết từng hành vi — trước khi dùng để xử lý một vụ việc cụ thể, cần tải bản đầy đủ trên Công báo Chính phủ.",
 src:{label:"Công báo Chính phủ",url:"https://congbao.chinhphu.vn/van-ban/nghi-dinh-so-87-2026-nd-cp-469359/64268.htm"},
 q:"Nghị định 87/2026/NĐ-CP xử phạt vi phạm hành chính văn hóa quảng cáo toàn văn"},

{id:"bienhieu",cat:"qc",tier:3,
 title:"Biển hiệu cơ sở — nội dung bắt buộc và mức phạt",
 code:"Điều 34 Luật Quảng cáo 16/2012/QH13 · xử phạt tại Điều 67 Nghị định 87/2026/NĐ-CP", eff:"Nghị định xử phạt hiệu lực 15/5/2026",
 essence:"Biển hiệu là thứ ai đi qua cũng nhìn thấy, nên cũng là thứ dễ bị lập biên bản nhất mà không cần vào bên trong kiểm tra. Nội dung bắt buộc nằm ở Luật Quảng cáo, còn mức phạt nằm ở nghị định xử phạt mới.",
 duties:["Kiểm tra biển hiệu có đủ thông tin bắt buộc theo Điều 34 Luật Quảng cáo: tên cơ sở, địa chỉ, điện thoại, đúng quy định về chữ viết và kích thước.",
   "Kiểm tra biển hiệu không lấn vỉa hè, lòng đường và tuyệt đối không che lối thoát hiểm — đây là lỗi vừa bị phạt về biển hiệu vừa bị phạt về phòng cháy.",
   "Rà cả biển hiệu của các bộ phận trực thuộc như khu spa, khu chăm sóc da nếu chúng treo biển riêng."],
 risks:["Thiếu tên, địa chỉ, điện thoại hoặc sai kích thước: phạt 5 đến 10 triệu đồng với cá nhân.",
   "Sai quy định về chữ viết tiếng Việt: phạt 10 đến 15 triệu đồng với cá nhân.",
   "Lấn vỉa hè lòng đường hoặc che lối thoát hiểm: phạt 15 đến 20 triệu đồng với cá nhân, kèm buộc tháo dỡ. Tổ chức chịu mức gấp đôi cá nhân."],
 notes:"Một điểm chưa chốt được khi kiểm chứng ngày 09/09/2026: Luật số 75/2025/QH15 sửa đổi Luật Quảng cáo có hiệu lực 01/01/2026 và có sửa nhiều điều trong dải Điều 30 đến 38, nhưng các nguồn không thống nhất về việc Điều 34 có bị sửa hay không. Nội dung bắt buộc nêu trên vẫn đúng theo bản đang được viện dẫn, tuy nhiên nếu làm biển hiệu mới thì nên đối chiếu bản hợp nhất trên Công báo trước khi đặt in.",
 src:{label:"Nghị định 87/2026/NĐ-CP",url:"https://thuvienphapluat.vn/van-ban/Thuong-mai/Nghi-dinh-87-2026-ND-CP-xu-phat-vi-pham-hanh-chinh-linh-vuc-van-hoa-va-quang-cao-700858.aspx"},
 q:"Điều 34 Luật Quảng cáo biển hiệu nội dung bắt buộc xử phạt Nghị định 87/2026"},
